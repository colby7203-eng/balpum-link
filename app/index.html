<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>발품투어 매물장</title>
<script src="config.js"></script>
<script src="backend.js"></script>
<script src="flyer.js"></script>
<script src="bp.js"></script>
<script src="cal.js"></script>
<script src="room.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E2A78">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Nanum+Pen+Script&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1E2A78; --navy-d:#151E5C; --sky:#E1F2FB; --sky-line:#9CCBE6;
    --bg:#F3F5FA; --paper:#FFFFFF; --ink:#1A1F36; --muted:#6B7280; --line:#DDE2EC;
    --ok:#1F7A4D; --ok-soft:#E3F3EA; --warn:#B4531A; --warn-soft:#FBEEE3; --gray-soft:#EEF0F4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;line-height:1.5;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px}
  h1{font-size:22px;margin:8px 0 2px;color:var(--navy);text-align:center}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 22px}
  button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:22px 16px;
    border-radius:10px;font-size:18px;font-weight:700;margin-bottom:14px;border:1px solid transparent}
  .big.add{background:var(--navy);color:#fff}
  .big.list{background:var(--sky);color:var(--navy);border-color:var(--sky-line)}
  .top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .back{background:none;border:none;color:var(--navy);font-size:16px;padding:8px 4px;font-weight:600}
  .top h2{font-size:18px;margin:0;flex:1;text-align:center;padding-right:48px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--navy);outline-offset:0;border-color:var(--navy)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{display:block;width:100%;padding:14px;border-radius:8px;border:none;background:var(--navy);color:#fff;font-weight:700;font-size:16px;margin-top:18px}
  .btn:disabled{opacity:.55}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
  .btn.danger{background:#fff;color:var(--warn);border:1px solid var(--warn)}
  .search{position:sticky;top:0;background:var(--bg);padding:4px 0 10px;z-index:5}
  .search input{font-size:17px;padding:13px 14px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  #sorts .chip{background:var(--bg)} #sorts .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink)}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .count{font-size:14px;color:var(--muted);margin:4px 2px 10px}
  .count b{color:var(--navy);font-size:16px}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;width:100%;color:inherit}
  .thumb{width:72px;height:72px;border-radius:8px;object-fit:cover;background:var(--gray-soft);flex:none}
  .noimg{width:72px;height:72px;border-radius:8px;background:var(--gray-soft);flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
  .info{min-width:0;flex:1}
  .nm{font-weight:700;font-size:16px;overflow-wrap:anywhere}
  .pr{color:var(--navy);font-weight:700;margin-top:2px}
  .ln{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
  .badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;margin-right:4px;vertical-align:1px}
  .b-deal{background:var(--sky);color:var(--navy)}
  .b-on{background:var(--ok-soft);color:var(--ok)}
  .b-off{background:var(--gray-soft);color:var(--muted)}
  .b-hold{background:var(--warn-soft);color:var(--warn)}
  .dl{display:grid;grid-template-columns:84px 1fr;gap:10px 12px;font-size:15px}
  .dl dt{color:var(--muted);font-size:13px;padding-top:2px}
  .dl dd{margin:0;overflow-wrap:anywhere}
  .mini{font-size:13px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--navy);margin-left:6px}
  .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
  .gal img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px;background:var(--gray-soft)}
  .box{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;z-index:50;touch-action:none;overflow:hidden}
  .box img{max-width:100%;max-height:100%;user-select:none;-webkit-user-select:none;transform-origin:center center;will-change:transform}
  .bx-hint{position:absolute;top:22px;left:16px;color:rgba(255,255,255,.7);font-size:12px}
  .bx-close{position:absolute;top:12px;right:12px;width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:26px;line-height:48px}
  .bx-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:28px;border-radius:8px}
  .bx-prev{left:8px} .bx-next{right:8px}
  .bx-count{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;background:rgba(0,0,0,.4);padding:4px 12px;border-radius:999px}
  .msg{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:90%}
  .loading{text-align:center;color:var(--muted);padding:40px 0}
  .empty{text-align:center;color:var(--muted);padding:30px 0;font-size:14px}
  .err{color:var(--warn);font-size:14px;margin-top:10px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .stat{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .pbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 8px;border-radius:8px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;font-size:15px}
  .pbtn:disabled{opacity:.5}
  .pcount{font-size:13px;color:var(--muted);margin-top:8px}
  .picked{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
  .picked div{position:relative}
  .picked img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px}
  .picked button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:24px;padding:0}
  .bx-del{position:absolute;bottom:14px;left:12px;border:none;background:rgba(198,40,40,.85);color:#fff;font-size:14px;padding:8px 12px;border-radius:8px}
  .big.cust{background:#F3E8FF;color:#6B21A8;border-color:#D8B4FE}
  .b-kind{background:#F3E8FF;color:#6B21A8}
  .rec{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
  .rec:first-child{border-top:none}
  .rec .d{color:var(--muted);font-size:12px}
  .why{font-size:12px;color:#6B21A8;margin-top:2px}
  .sect{font-size:15px;font-weight:700;margin:20px 0 8px;color:var(--navy)}
  .addrec{display:flex;gap:8px;margin-top:10px}
  .addrec input{flex:1}
  .addrec button{flex:none;padding:0 14px;border-radius:8px;border:none;background:var(--navy);color:#fff;font-weight:700}
  /* 매물v1.5 첫 화면 아래 */
  .credit{text-align:center;font-size:12px;color:var(--muted);margin-top:18px;line-height:1.7;border-top:1px solid var(--line);padding-top:12px}
  .credit .cn{font-size:14px;font-weight:700;color:var(--navy)}
  .credit a{color:var(--navy);text-decoration:none}
  .credit .mb{margin-top:6px;font-style:italic;font-weight:700;color:#B45309}
  /* 매물v1.4 답사 */
  .big.tour{background:#F59E0B;color:#fff;border-color:#D97706}
  .tourbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:10px;border:1px solid #D97706;background:#F59E0B;color:#fff;font-size:17px;font-weight:800;margin:4px 0 12px}
  .seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--navy);border-radius:10px;overflow:hidden;margin-bottom:12px}
  .seg button{padding:12px 6px;border:none;background:#fff;color:var(--navy);font-size:15px;font-weight:700}
  .seg button.on{background:var(--navy);color:#fff}
  .b-co{background:#FEF3C7;color:#92400E}
  .cbtn{background:#F3E8FF;color:#6B21A8;border-color:#D8B4FE;margin-left:auto}
  .tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:10px}
  .tools .mini{margin-left:0}
  #cmp{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .cmpin{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px 24px}
  .rose{position:relative;width:180px;height:180px;margin:14px auto 6px;border:3px solid var(--navy);border-radius:50%;background:var(--sky)}
  .rose .needle{position:absolute;left:0;right:0;top:12px;bottom:12px;text-align:center;font-size:38px;color:#C62828;line-height:1;transition:transform .15s linear}
  .rose .rn,.rose .rs,.rose .re,.rose .rw{position:absolute;font-weight:800;color:var(--navy);font-size:14px}
  .rose .rn{top:-22px;left:50%;transform:translateX(-50%)} .rose .rs{bottom:-22px;left:50%;transform:translateX(-50%)}
  .rose .re{right:-20px;top:50%;transform:translateY(-50%)} .rose .rw{left:-20px;top:50%;transform:translateY(-50%)}
  .cmpv{text-align:center;font-size:30px;color:var(--navy);margin:18px 0 4px}
  .cmpv span{font-size:18px;color:var(--muted)}
  .dirgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .dirgrid .chip{padding:12px 0;font-size:15px}
  /* 매물v1.9 칸별 답사사진 */
  .slotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .slot{position:relative;aspect-ratio:1/1;border:1.5px dashed #94a3b8;border-radius:10px;background:#f8fafc;overflow:hidden;padding:0;display:flex;align-items:center;justify-content:center}
  .slot.on{border:2px solid #15803d;background:#fff}
  .slot.hidemode{border-color:#B4531A}
  .slot img{width:100%;height:100%;object-fit:cover}
  .slot .cam{font-size:26px;opacity:.55;margin-bottom:18px}
  .slot .sn{position:absolute;left:0;right:0;bottom:0;background:rgba(15,23,42,.72);color:#fff;font-size:12.5px;font-weight:700;padding:4px 2px;text-align:center;line-height:1.2}
  .slot:not(.on) .sn{background:transparent;color:var(--navy)}
  .tpl{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
  .tpi img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:#e5e7eb}
  #tpv{position:fixed;inset:0;background:#000;z-index:60;display:flex;align-items:center;justify-content:center}
  #tpv img{max-width:100%;max-height:100%}

  /* ===== 매물v2.3 새 스타일 (선 아이콘 · 둥근 카드 · 남색/주황) ===== */
  :root{ --navy:#1E2A78; --navy-d:#141B52; --bg:#F4F6FB; --line:#E2E8F0; --line2:#DCE2F5; --ink:#0F172A; --muted:#475569;
         --or:#F59E0B; --or-ink:#B45309; --or-soft:#FFFBEB; --sky:#EEF1FB; --sky-line:#DCE2F5 }
  html,body{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.2px}
  .wrap{padding:0 14px 40px}
  .ic{display:inline-flex;align-items:center;justify-content:center;width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
  .ic svg{width:100%;height:100%}
  /* 위쪽 남색 머리줄 */
  .top{margin:0 -14px 14px;padding:12px 14px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px}
  .top h2{color:#fff;font-size:18px;font-weight:800;text-align:left;padding-right:0;display:flex;align-items:center;gap:6px}
  .back{background:rgba(255,255,255,.14)!important;color:#fff!important;border-radius:12px;padding:8px 12px!important;font-size:14px!important;font-weight:700;display:inline-flex;align-items:center;gap:4px;min-height:40px;flex:none}
  /* 카드 · 단추 · 입력칸 */
  .card{border-radius:16px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .item{border-radius:16px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(15,23,42,.04)}
  .thumb,.noimg{border-radius:12px}
  .btn{border-radius:12px;min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700}
  .btn.ghost{border:1px solid var(--line2);color:var(--navy);background:#fff}
  .btn.danger{border:1px solid #F3C9B3}
  input,select,textarea{border-radius:12px;border-color:var(--line2)}
  .chip{border-color:var(--line2);font-weight:600;min-height:34px;display:inline-flex;align-items:center;gap:4px}
  .mini{border-radius:16px;border-color:var(--line2);font-weight:700;padding:6px 12px;min-height:32px;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
  .mini.solid{background:var(--navy);color:#fff;border-color:var(--navy)}
  .pbtn{border-radius:12px;border-color:var(--line2)}
  .seg{border:0;background:#E7EBF6;padding:4px;border-radius:14px;gap:4px}
  .seg button{border-radius:10px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent}
  .seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(15,23,42,.12)}
  .sect{font-weight:800;display:flex;align-items:center;gap:6px}
  .tourbtn{border-radius:14px;border:0;background:var(--or);color:#1F1300;box-shadow:0 3px 10px rgba(245,158,11,.25)}
  .badge{border-radius:6px;font-weight:700}
  .b-hold{background:#FEF3C7;color:var(--or-ink)}
  .search{padding-top:2px}
  .msg{border-radius:12px}
  /* 첫 화면 */
  .hero{margin:0 -14px 16px;padding:22px 18px 20px;background:var(--navy);color:#fff;border-radius:0 0 22px 22px}
  .hero .brand{font-size:12.5px;color:#C7D2FE;font-weight:700;letter-spacing:.5px}
  .hero .ttl{font-size:24px;font-weight:800;margin-top:2px}
  .hero .ofc{font-size:13.5px;color:#E0E7FF;margin-top:4px}
  .menu{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:16px;border:1px solid var(--line);background:#fff;margin-bottom:10px;text-align:left;color:var(--ink);box-shadow:0 2px 10px rgba(30,42,120,.06)}
  .menu .tile{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--sky);color:var(--navy)}
  .menu .tile svg{width:26px;height:26px}
  .menu .tx{flex:1;display:flex;flex-direction:column}
  .menu .t1{font-size:17px;font-weight:800}
  .menu .t2{font-size:12.5px;color:var(--muted)}
  .menu .chev{color:#94A3B8}
  .menu.main .tile{background:var(--navy);color:#fff}
  .menu.orange{border:1.5px solid var(--or)} .menu.orange .tile{background:var(--or);color:#1F1300}
  /* 답사 카드 */
  .stopcard{background:#fff;border-radius:18px;border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:11px}
  .stopcard.cur{border:2px solid var(--or);box-shadow:0 4px 16px rgba(245,158,11,.18)}
  .snum{width:42px;height:42px;border-radius:50%;color:#fff;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
  .irow{display:flex;align-items:center;gap:8px;font-size:14px;color:#334155;min-height:34px}
  .irow .lic{color:#64748B;width:18px;height:18px}
  .irow .grow{flex:1;min-width:0;overflow-wrap:anywhere}
  .react3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .react3 .chip{justify-content:center;font-size:20px;min-height:44px;border-radius:12px;margin:0}
  .react3 .chip.on{background:var(--sky);color:var(--navy);border:2px solid var(--navy)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn.or{background:var(--or-soft);color:var(--or-ink);border:1.5px solid var(--or)}
  .mapcta{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;background:#fff;border:1.5px solid var(--line2);box-shadow:0 2px 10px rgba(30,42,120,.10);text-align:left;margin:0 0 10px;color:var(--ink)}
  .mapcta .tile{width:46px;height:46px;border-radius:14px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .mapcta .tile svg{width:24px;height:24px}
  .prog{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;margin:4px 0 10px}
  .prog div{height:6px;background:var(--navy)}
  /* 지도 전체 화면 */
  .kfull{position:fixed;inset:0;z-index:40;background:#EEF1F5}
  .kfull #kmap{position:absolute;inset:0}
  .kfloat{position:absolute;z-index:3}
  .kbtn{width:48px;height:48px;border-radius:50%;border:0;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(15,23,42,.2);padding:0}
  .kbtn svg{width:22px;height:22px}
  .kbtn.main{width:58px;height:58px;background:var(--navy);color:#fff;flex-direction:column;gap:1px;font-size:10px;font-weight:700;box-shadow:0 4px 12px rgba(30,42,120,.35)}
  .kseg{height:46px;border-radius:23px;background:#fff;box-shadow:0 2px 10px rgba(15,23,42,.2);display:flex;align-items:center;padding:4px;gap:4px}
  .kseg button{flex:1;height:38px;border-radius:19px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
  .kseg button.on{background:var(--navy);color:#fff}
  .kchip{position:absolute;left:14px;top:72px;z-index:3;min-height:30px;border-radius:15px;background:rgba(15,23,42,.8);color:#fff;font-size:12.5px;padding:5px 12px;display:flex;align-items:center;max-width:calc(100% - 28px)}
  .ksheet{position:absolute;left:0;right:0;bottom:0;z-index:4;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(15,23,42,.14);padding:10px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow:auto}
  .ksheet .handle{width:100%;height:26px;margin:-10px 0 -6px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;touch-action:none}
  .ksheet .handle span{width:44px;height:5px;border-radius:3px;background:#CBD5E1}
  .ksheet .pr{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ksheet.min{gap:6px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .ksheet.min .kx{display:none!important}
  .ksheet.min .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ksheet .kmin{display:none}
  .ksheet.min .kmin{display:inline-flex}
  .kbtn.lb{flex-direction:column;gap:1px;font-size:10px;font-weight:700;width:52px;height:52px}
  .kbtn.lb svg{width:20px;height:20px}

<script>

  var m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);

  if (/^https?:\/\//.test(u)) return u;
  if (u.length > 100 && /^[A-Za-z0-9+\/=]+$/.test(u)) return "data:image/jpeg;base64," + u;

}
function photosOf(s){
  if (!s) return [];
  s = String(s).trim();
  var arr = null;
  if (s.charAt(0) === "[") { try { var j = JSON.parse(s); if (Array.isArray(j)) arr = j.map(function(x){ return typeof x === "string" ? x : (x && (x.url || x.data || x.src)) || ""; }); } catch (e) {} }
  if (!arr) {
    var m = s.match(/data:image\/[a-zA-Z+.\-]+;base64,[A-Za-z0-9+\/=]+|https?:\/\/[^\s,|;"']+/g);
    if (m && m.length) arr = m;
    else arr = s.split(/[\n|,;]+/);

/* ---------- 사진 올리기 (PC 프로그램과 같은 형식: 압축 JPEG base64, 한 줄에 한 장) ---------- */
var PHOTO_MAX_CHARS = 45000, PHOTO_MAX_COUNT = 12;
function photoLines(s){ return String(s || "").split(/\r?\n/).map(function(x){ return x.trim(); }).filter(function(x){ return x; }); }
function loadImg(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file); var img = new Image();
    img.onload = function(){ res(img); };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("사진을 읽지 못했어요. 다른 사진으로 해 주세요.")); };
    img.src = url;
  });

// [매물v1.7] 줄이는 단계 (PC 프로그램과 같음) — 자리가 모자라면 더 작은 단계까지
var PHOTO_STEPS = [[400, .5], [350, .45], [300, .4], [250, .35], [200, .3], [160, .28], [130, .25], [110, .22], [90, .2]];

  if (start) { steps = PHOTO_STEPS.filter(function(x){ return x[0] <= start; }); if (!steps.length) steps = [PHOTO_STEPS[PHOTO_STEPS.length - 1]]; }
  var out = null;
  for (var i = 0; i < steps.length; i++) {
    var w = img.naturalWidth, h = img.naturalHeight, r = Math.min(1, steps[i][0] / Math.max(w, h));
    w = Math.max(1, Math.round(w * r)); h = Math.max(1, Math.round(h * r));
    var c = document.createElement("canvas"); c.width = w; c.height = h;

}
function compressPhoto(file, limit){

function shrinkB64(b64, limit){      // 이미 올라간 사진을 limit 글자 안으로 줄임 (못 줄이면 그대로)

  return new Promise(function(res){

    img.onload = function(){ var o = encodeImg(img, limit, Math.max(img.naturalWidth, img.naturalHeight)); res(o && o.length < b64.length ? o : b64); };

  });
}
// 기존 사진 + 새 사진을 한도 안에 맞춤. 자리가 모자라면 큰 기존 사진을 줄여서 자리를 만듦

function fitPhotos(have, files){
  var n = have.length + files.length; if (!n) return Promise.resolve({ add: "" });
  var per = Math.floor((PHOTO_MAX_CHARS - (n - 1)) / n), enc = [];
  function total(l){ return l.reduce(function(a, x){ return a + x.length; }, 0) + Math.max(0, l.length - 1); }
  return files.reduce(function(p, f){ return p.then(function(){ return compressPhoto(f, per).then(function(e){ if (e) enc.push(e); }); }); }, Promise.resolve())
    .then(function(){
      if (total(have.concat(enc)) <= PHOTO_MAX_CHARS) return { add: enc.join("\n") };
      var shrunk = 0;
      return Promise.all(have.map(function(h){ return shrinkB64(h, per).then(function(o){ if (o.length < h.length) shrunk++; return o; }); }))

function buildPhotoPart(files, existingStr){      // 새 매물 등록용 (기존 사진 없음)

// 카메라/앨범 버튼 → 파일 고르기

/* ---------- 가격 정렬 (PC 프로그램 price_sort_key 와 같은 규칙, 단위: 만원) ---------- */
var AMT = /\s*(\d[\d,]*(?:\.\d+)?)\s*(억|천|백)?\s*(?:만)?\s*(?:원)?/y;
var UNIT_V = { "억": 10000, "천": 1000, "백": 100, "": 1 }, UNIT_R = { "억": 3, "천": 2, "백": 1, "": 0 };
function readAmount(t, start){
  var pos = start, total = 0, last = 4, found = false;
  while (true) {
    AMT.lastIndex = pos; var m = AMT.exec(t); if (!m) break;
    var u = m[2] || "", r = UNIT_R[u]; if (r >= last) break;
    var num = parseFloat(m[1].replace(/,/g, "") || "0");
    if (u === "" && !found && num >= 100000) num = num / 10000; // 원 단위로 쓴 경우
    if (u === "" && found && last === 3) {                     // '1억6' = 1억6천, '1억65' = 1억6천5백
      if (/^\s*(호|층|평|㎡|%|개|세대|번지|년|월|일)/.test(t.slice(AMT.lastIndex))) break;
      var raw = m[1].replace(/,/g, "");
      if (m[1].indexOf(",") < 0 && raw.indexOf(".") < 0 && raw.length >= 1 && raw.length <= 3) num = num * Math.pow(10, 4 - raw.length);
    }
    total += num * UNIT_V[u]; found = true; last = r; pos = AMT.lastIndex;
    if (r === 0) break;
  }
  return [found ? total : null, pos];
}
// 금액이 아닌 숫자 (호수·층·평수·날짜·방 개수) 는 건너뜀 — PC 프로그램과 같은 규칙
function moneyStarts(s){
  var out = [], re = /\d[\d,\.]*/g, m;
  while ((m = re.exec(s))) {
    var after = s.slice(m.index + m[0].length), before = s.slice(0, m.index);
    var n = parseFloat(m[0].replace(/,/g, ""));
    if (/^\s*(호|층|동(?!\s*안)|평|㎡|m²|m\b|%|개|세대|가구|룸|번지|번|차|분|시간|년|살|명|대|칸)/.test(after) && !/^\s*(억|천|백|만|원)/.test(after)) continue;
    if (/(방|화|룸|화장실|욕실|보일러|제|No\.?|no\.?)\s*$/.test(before)) continue;
    if (/^\s*월(?!\s*세)/.test(after) && n <= 12) continue;
    if (/^\s*일/.test(after) && n <= 31) continue;
    out.push(m.index);
  }
  return out;
}
function priceKey(p){
  var s = String(p || ""), starts = moneyStarts(s);
  if (!starts.length) return null;
  var start = starts[0], idx = s.indexOf("입금");
  if (idx >= 0) {
    // 입금 뒤 금액 ('입금 1억', '입금가 120백')
    var after = /^[\s가:：=은는]*(?=\d)/.exec(s.slice(idx + 2));
    var afterStart = after ? idx + 2 + after[0].length : -1;
    // 입금 앞 금액 ('1억2천 입금', '113백만원입금', '140백 입금 149 광고')
    var re = /\d[\d,\.]*\s*(?:(?:억|천|백)\s*(?:\d[\d,\.]*\s*(?:천|백)?\s*)*)?(?:만)?\s*(?:원)?\s*/g, m, pre = s.slice(0, idx);
    var beforeStart = -1, beforeAdj = false;
    while ((m = re.exec(pre))) { if (starts.indexOf(m.index) >= 0) { beforeStart = m.index; beforeAdj = (m.index + m[0].length === pre.length); } }
    var useBefore;
    if (beforeStart < 0) useBefore = false;
    else if (afterStart < 0) useBefore = true;
    else {
      var afterTail = s.slice(readAmount(s, afterStart)[1]);
      var afterIsAd = /^\s*(광고|홍보)/.test(afterTail);                       // '입금 149 광고' 의 149 는 광고가
      var beforeIsAd = /(광고|홍보)[가:\s]*$/.test(s.slice(0, beforeStart)); // '광고 150백 입금 140백' 의 150백 은 광고가

    }

}
var SORT = "new";
try { SORT = localStorage.getItem("mm_sort") || "new"; } catch (e) {}
// [매물v1.5] PC 프로그램과 같은 정렬
//  · 매매인데 1천만원보다 작게 읽히면 백만원 단위로 적은 것 ('120입금' → 1억2천)
//  · 검색어에 '월'·'월세'가 있거나 보이는 매물 절반 넘게 월세면 월세 금액 기준
function saleKey(it){
  var k = priceKey(it.price); if (!k) return null;
  var amount = k[0], p = String(it.price || "");
  if (/매매/.test(it.deal_type || "") && amount < 1000 && p.indexOf("/") < 0 && p.indexOf("월") < 0) amount *= 100;

function rentKey(p){
  var s = String(p || ""), m = /\/\s*(?:월세?\s*)?(\d[\d,]*(?:\.\d+)?)/.exec(s);
  if (m) {
    var monthly = parseFloat(m[1].replace(/,/g, "")), pre = s.slice(0, m.index), dep = null;

  if (m) {

    return [mo, b >= 0 ? (readAmount(s, b)[0] || 0) : 0];
  }

  if (m) return [parseFloat(m[2]), parseFloat(m[1]) * 100];

}
function wantsRent(q, rows){
  var words = String(q || "").trim().split(/\s+/).filter(Boolean);
  if (words.some(function(w){ return w === "월" || w.indexOf("월세") >= 0; })) return true;
  if (words.some(function(w){ return w.indexOf("매매") >= 0 || w.indexOf("전세") >= 0; })) return false;
  var n = rows.length;
  return n > 0 && rows.filter(function(r){ return /월/.test(r.deal_type || ""); }).length * 2 > n;
}
var LAST_RENT = false;
function sortRows(rows, q){
  if (SORT === "new") return rows; // ITEMS 가 이미 최신순
  var dir = SORT === "low" ? 1 : -1;
  var rent = LAST_RENT = wantsRent(q === undefined ? Q : q, rows);
  function key(it){
    if (rent) { if (it._rk === undefined) it._rk = rentKey(it.price); return it._rk; }
    if (it._sk === undefined) it._sk = saleKey(it); return it._sk;
  }

    var ka = key(a), kb = key(b);

  if ($("lgRs")) $("lgRs").onclick = function(e){ e.preventDefault(); showLogin("", "reset"); };
  var em = function(){ return $("lgE").value.trim(); };
  $("lgGo").onclick = function(){
    if (mode === "in") {
      if (!em() || !$("lgP").value) { toast("이메일과 비밀번호를 넣어 주세요."); return; }
      busy(true, "확인 중…");
      BALPUM.Auth.signIn(em(), $("lgP").value).then(function(){ OFFICE_LOADED = false; startHome(); })
        .catch(function(e){ showLogin(errText(e), "in"); if ($("lgE")) $("lgE").value = em(); });
    } else if (mode === "reset") {
      if (!em()) { toast("이메일을 넣어 주세요."); return; }
      busy(true, "보내는 중…");
      BALPUM.Auth.resetPassword(em()).then(function(){ showLogin("", "in", "메일을 보냈어요. 메일의 링크로 새 비밀번호를 만든 뒤 로그인해 주세요."); })
        .catch(function(e){ showLogin(errText(e), "reset"); });
    } else {
      var v = function(id){ return $(id).value.trim(); };
      if (!em() || !/^\S+@\S+\.\S+$/.test(em())) { toast("이메일을 확인해 주세요."); return; }
      if ($("lgP").value.length < 6) { toast("비밀번호는 6자리 이상으로 해 주세요."); return; }
      if ($("lgP").value !== $("lgP2").value) { toast("비밀번호 두 칸이 서로 달라요."); return; }
      var kind = $("lgK").value;
      if (!v("lgO") || !v("lgM") || (kind === MEMBER_TYPES[0] && !v("lgR"))) { toast(kind === MEMBER_TYPES[0] ? "* 표시한 칸(사무소 이름 · 등록번호 · 핸드폰)을 채워 주세요." : "* 표시한 칸(이름 · 핸드폰)을 채워 주세요."); return; }
      if (!$("lgOk").checked) { toast("저장 동의에 체크해 주세요."); return; }
      busy(true, "가입하는 중…");
      BALPUM.Auth.signUp(em(), $("lgP").value, { member_type: kind, office_name: v("lgO"), reg_no: v("lgR"), ceo: v("lgC"), mobile: v("lgM"), tel: v("lgT"), addr: v("lgA") })
        .then(function(r){
          if (r.needConfirm) showLogin("", "in", "가입 확인 메일을 보냈어요. 메일의 링크를 누른 뒤 여기서 로그인해 주세요. (스팸함도 확인)");
          else { OFFICE_LOADED = false; startHome(); }
        }).catch(function(e){ busy(false, "가입하기"); toast(errText(e)); });
    }
  };
  var last = $("lgP") || $("lgE");
  last.onkeydown = function(e){ if (e.key === "Enter") $("lgGo").click(); };
  setTimeout(function(){ if ($("lgE")) $("lgE").focus(); }, 50);
}

function bpHomeLink(t){ var u = BALPUM.config.HOMEPAGE; return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(t || "홈페이지") + '</a>' : esc(t || "홈페이지"); }
function bpUsage(){
  BALPUM.Office.usage().then(function(u){
    var el = $("usage"); if (!el) return;
    var html = '';
    if (u.notice) html += '<div class="note">' + esc(u.notice) + '</div>';
    if (u.plan === "free") {
      var warn = u.left <= 10;
      html += '<div class="usage' + (warn ? ' warn' : '') + '"><b>무료 체험 중</b> · 남은 등록 <b>' + u.left + '건</b> <span class="hint">(지금까지 ' + u.used + '건 · 진행 중 ' + u.active + '건)</span>' +
        (warn ? '<div>' + (u.left ? u.left + '건 더 등록하시면 무료 체험이 끝나요. ' : '무료 체험 등록을 다 썼어요. ') + '매물장 늘리는 방법은 ' + bpHomeLink("홈페이지") + '에서 보세요.</div>' : '') + '</div>';
    }
    el.innerHTML = html;
  }).catch(function(){});
}

var MANUAL_BODY = "<div class=\"mhead\">\n  <div class=\"mtitle\">발품투어 매물장 사용법</div>\n  <div class=\"msub\">공인중개사 답사순서표 &amp; 臨場 임장관리 · 발품 v1.3 · <b>Made by 정동철</b></div>\n</div>\n\n<p class=\"tip\">🏠 홈페이지 <b>https://colby7203-eng.github.io/balpum-link/</b><br>다른 핸드폰에 깔아 줄 때 · PC에서 쓸 때 이 주소로 들어가요. [내 사무소 · 계정]에서 복사 · 카톡·문자 보내기 · QR 보기가 돼요.</p>\n\n<p><b>발품을 기록으로 바꾸고, 기록을 노하우로 바꾸는 것.</b> 매물·손님·답사·수리·입주·신축 현장을 핸드폰 하나로 챙기는 매물장입니다. 자료는 내 계정에만 저장되고, 다른 사무소는 볼 수 없어요.</p>\n\n<h2 id=\"start\">1. 처음 시작</h2>\n<ul>\n  <li><b>가입</b>: 이메일·비밀번호와 사무소 정보(이름·등록번호·핸드폰)를 넣으면 끝. 확인 메일이 오면 링크를 누른 뒤 로그인하세요.</li>\n  <li><b>내 사무소 · 계정</b>: 사무소 정보 고치기, 무료 체험 남은 건수 보기, 로그아웃.</li>\n  <li><b>무료 체험</b>: 매물을 <b>80건 등록할 때까지</b> 모든 기능이 무료예요. 그 뒤로는 <b>월 8,000원</b>(진행 중 매물 100건까지). 계약·보류된 매물은 지우지 말고 상태만 바꿔 두세요.</li>\n  <li><b>PC에서 쓰기</b>: PC 크롬·엣지로 홈페이지 → [PC에서 발품 열기] → 같은 이메일로 로그인. 오른쪽 아래 <b>[💻 바탕화면에 깔기]</b>를 누르면 바탕화면 아이콘이 생겨요.</li>\n</ul>\n\n<h2 id=\"list\">2. 매물 등록 · 조회</h2>\n<ul>\n  <li><b>신규 매물 등록</b>: 사진을 찍어 바로 올려요 (한 매물 12장까지, 자동으로 작게 줄여 올림).</li>\n  <li><b>매물 조회 및 관리</b>: 붙여 써도 되는 검색 (예: <code>검암동방3화1</code>), 가격 정렬, 상태(진행중·보류·우리가 계약…), 휴지통.</li>\n  <li>관리비·관리비에 들어 있는 것·계량기 위치도 적어 둘 수 있어요.</li>\n</ul>\n\n<h2 id=\"tour\">3. 답사 (발품 투어)</h2>\n<ul>\n  <li>보여 줄 집을 고르고 순서를 정하면 <b>답사순서표</b>가 돼요. 잘 짠 동선은 이름을 붙여 저장하고 다음 손님에게 다시 씁니다.</li>\n  <li><b>지도</b>로 동선 보기, 카카오맵·네이버지도로 <b>길안내</b>.</li>\n  <li><b>칸별 사진</b>: 주차장·현관·주방·안방… 칸을 누르고 찍으면 그 칸에 들어가요. 칸 목록은 고칠 수 있어요.</li>\n  <li>🧭 방향 재기로 집 방향을 매물에 저장.</li>\n</ul>\n\n<h2 id=\"cust\">4. 고객관리</h2>\n<ul>\n  <li>손님 정보·연락 기록·맞는 매물 찾기. 고친 내용은 변경 기록으로 남아요.</li>\n</ul>\n\n<h2 id=\"repair\">5. 수리 견적</h2>\n<ul>\n  <li>수리할 곳 사진을 찍고 종류를 고르면 <b>대략 견적</b>이 나와요. 단가표는 내 동네 값으로 고쳐 쓰세요.</li>\n  <li>근처 업체를 찾아 <b>한 곳씩</b> 견적 문자를 보내요. <b>내 핸드폰으로 차례로 보내기</b>: 문자 앱이 열리면 [보내기]만 누르고 돌아오면 다음 업체로 넘어가요.</li>\n  <li>문자에는 <b>사진 링크</b>가 들어가요. 업체는 로그인 없이 사진·동네·내용만 볼 수 있고, 14일이 지나면 닫혀요.</li>\n  <li>실제로 거래한 업체는 <b>내 업체 수첩</b>에 저장해 두세요.</li>\n</ul>\n\n<h2 id=\"move\">6. 입주 · 이사</h2>\n<ul>\n  <li>이사 날짜를 넣으면 할 일(전기·가스·수도·인터넷)이 차례로 나와요. 이사 견적도 업체에 한 곳씩 문의할 수 있어요.</li>\n  <li>계량기 사진은 업체 링크에 나오지 않아요.</li>\n</ul>\n\n<h2 id=\"site\">7. 신축 현장</h2>\n<ul>\n  <li>분양속지 사진을 찍어 두고 호수표·남은 세대·분양 조건·수수료를 정리해요.</li>\n  <li>AI를 연결하면 속지 사진을 읽어 호수표를 자동으로 채워 줘요. (꼭 눈으로 한 번 확인하세요)</li>\n</ul>\n\n<h2 id=\"ai\">8. AI 연결 (무료)</h2>\n<ul>\n  <li><a href=\"https://aistudio.google.com/app/apikey\" target=\"_blank\" rel=\"noopener\">aistudio.google.com/app/apikey</a> 에 구글 계정으로 로그인 → 파란 <b>Create API key</b> → 나온 긴 글자(AIza 또는 AQ.로 시작) 복사 → [AI 연결]에 붙여 넣기 → [저장] → [연결 확인].</li>\n  <li><b>안심하세요</b>: 이 키를 붙여도 이미 쓰고 계신 다른 프로그램은 그대로 잘 돼요. 같은 키를 여러 곳에 쓰면 하루 무료 사용량을 나눠 쓰니, 많이 쓰시면 프로그램마다 따로 만드세요.</li>\n  <li>무료 등급에서는 보낸 사진·글을 구글이 서비스 개선에 쓸 수 있어요. <b>수리 부위·분양속지 사진만</b> 보내고, 손님 얼굴·신분증·계약서는 찍지 마세요.</li>\n  <li>\"붐벼요\"가 뜨면 1~2분 뒤 다시 누르세요.</li>\n</ul>\n\n<h2 id=\"print\">9. 출력 센터 (홍보장 · 손님 안내문)</h2>\n<ul>\n  <li><b>📢 A4 홍보장</b>: [바로 만들기]를 누르면 <b>기본 샘플</b>(급매·반전세·월세·매매·빌라 전세·신축빌라 월세)이 나와요. 누르면 큰 글씨(제목 66 · 본문 60 · 가격 80)가 그대로 들어가요. 본문 첫 줄 박스(방3 화1)는 본문 글씨 크기에 맞춰 커져요.</li>\n  <li><b>자주 쓰는 말</b>(즉시 입주 가능 · LH전세 가능 · 역세권 도보 5분 · 올수리 …)을 누르면 본문에 한 줄씩 들어가요.</li>\n  <li><b>📄 손님 안내문</b>: 매물 상세 → [📄 손님 안내문] → 동네만 / 번지까지 고르고 사진 4장까지 → 미리보기 → 인쇄.</li>\n  <li><b>인쇄</b>: 미리보기의 <b>[🖨 인쇄]</b>. 핸드폰에서는 사무실 <b>와이파이 프린터</b>를 고르거나 <b>PDF로 저장</b>해서 카톡으로 보내요. PC에서는 A4로 바로.</li>\n  <li><b>💾 저장</b>하면 핸드폰에서 만들고 PC에서 열어 뽑을 수도 있어요. 사진은 앨범·PC의 <b>원본</b>을 고르면 선명해요.</li>\n</ul>\n\n<h2 id=\"cal\">10. 달력 · 약속 다이어리 · 가계부</h2>\n<ul>\n  <li>벽걸이 달력처럼 <b>음력 · 24절기 · 공휴일(쉬는 이유) · 손 없는 날 · 물때</b>가 나와요. 넘기면 쫙 찢기고, 지난달로 가면 탁 붙어요.</li>\n  <li>날짜를 누르고 <b>매직 동그라미 · 별표 · 깨알 메모 · 포스트잇</b>을 적어요. 큰 달 숫자 옆에는 이달 포스트잇을 붙여요.</li>\n  <li>물때 보기 옆 단추 <b>[📒 약속 다이어리] [💰 가계부] [📦 택배]</b>를 누르면 따로 창이 열려요. 창 위 ‹ › 로 하루씩 옮기고, [닫기]로 달력에 돌아와요.</li>\n  <li><b>약속 다이어리</b>: 약속(시각·장소·색) · 할 일 · 한 줄 일기.</li>\n  <li><b>가계부</b>: 수입·지출 · 남은 돈(실제 금액으로 한 번 맞추면 그날부터 이어서 계산). 아래에 이달 가계부 · 주 단위 지출 · 이번 달 예상이 같이 나와요.</li>\n  <li><b>택배</b>: 받은 물건을 적으면 같은 물건이 며칠마다 필요한지, 다음엔 언제쯤 떨어지는지 알려 줘요. 금액을 적으면 가계부에도 들어가요.</li>\n  <li>모두 내 계정에 저장돼서 핸드폰·PC 어디서나 같이 보여요.</li>\n</ul>\n\n<h2 id=\"room\">11. 손님 방 (손님 초대 · 상담 · 최저가 답장)</h2>\n<ul>\n  <li>첫 화면 <b>[손님 방] → [➕ 손님 초대하기]</b> → \"어떻게 온 손님인지\" 한 줄(비워도 돼요) → <b>[🔗 초대 링크 만들기]</b>.</li>\n  <li>초대 코드 6자리와 링크가 나와요. <b>[💬 문자로 보내기]</b> · <b>[📋 복사]</b>(카톡에 붙이기) · <b>[🔳 QR 보여 주기]</b>(사무실에서 손님 핸드폰 카메라로 찍기) 중 편한 것으로.</li>\n  <li>손님은 링크를 열면 \"○○이(가) 초대했어요\" 화면이 나오고, <b>이름 · 핸드폰 · 숫자 6자리 · 찾는 것</b>을 적고 동의하면 바로 시작해요. 손님은 무료예요.</li>\n  <li>손님이 들어오면 <b>고객관리에 저절로</b> 생겨요: 들어온 날 · 들어온 길(문자/카톡/QR) · 초대 메모 · 찾는 것. 같은 전화번호가 이미 있으면 새로 만들지 않고 그 손님 기록에 붙어요.</li>\n  <li>손님 방에서 <b>[🏠 매물 보내기]</b>로 내 매물을 골라 보내고, 손님이 <b>📊 최저가 정보</b>를 요청하면 <b>[📊 최저가 답장]</b>에 가격 · 한마디 · 네이버 광고 캡처를 넣어 보내요.</li>\n  <li>손님이 <b>📝 일반 의뢰</b>나 <b>🆘 몰래 빨리 팔아 주세요</b>(기간 1·2·3개월)를 고르면 손님 방에 주황색으로 와요. 수리 요청은 사진과 함께 와요.</li>\n  <li>새 상담이 오면 첫 화면 [손님 방]에 빨간 숫자가 붙어요. (핸드폰 알림은 다음 업데이트)</li>\n  <li><b>아이폰 손님</b>은 링크의 [이 화면에서 바로 쓰기]로 쓰고, 공유 → '홈 화면에 추가'하면 앱처럼 써요.</li>\n</ul>\n\n<h2 id=\"faq\">12. 자주 묻는 것</h2>\n<ul>\n  <li><b>다른 핸드폰에서도 되나요?</b> 같은 이메일로 로그인하면 같은 자료가 보여요.</li>\n  <li><b>비밀번호를 잊었어요</b>: 로그인 화면의 [비밀번호를 잊었어요] → 메일의 링크로 새로 만들기.</li>\n  <li><b>매물장을 늘리고 싶어요</b>: 매물장 늘리는 방법은 홈페이지에서 보세요.</li>\n</ul>\n";
function showHelp(fromHist, anchor){
  if (!fromHist) nav("help");
  window.scrollTo(0, 0);
  $("app").innerHTML = '<div class="top"><button class="back" id="bk">← 처음</button><h2>📖 사용법</h2></div>' +
    '<style>' + MANUAL_CSS + '</style>' +

    '<div class="manual">' + MANUAL_BODY + '</div>';
  $("bk").onclick = function(){ showHome(); };
  Array.prototype.forEach.call(document.querySelectorAll('#app a[href^="#"]'), function(a){
    a.onclick = function(e){ e.preventDefault(); var el = document.getElementById(a.getAttribute("href").slice(1)); if (el) el.scrollIntoView({ block: "start" }); };
  });
  if (anchor) { var el = document.getElementById(anchor); if (el) setTimeout(function(){ el.scrollIntoView(); }, 30); }
}

function showList(fromHist){
  if (!fromHist) nav("list");
  window.scrollTo(0, 0);
  $("app").innerHTML =
    '<div class="top"><button class="back" id="bk">← 처음</button><h2>매물 조회 및 관리</h2></div>' +
    '<div class="search"><input id="q" type="search" placeholder="예) 검암동방3화1, 홍길동, 010…" value="' + esc(Q) + '">' +
    '<div class="chips" id="chips"></div><div class="chips" id="sorts"></div></div>' +
    '<button class="tourbtn" id="lTour">🚶 검색한 매물로 답사하기</button>' +
    '<div class="chips" style="margin:-4px 0 10px"><button class="chip" id="lDong">🏘 동네 자동 채우기</button><button class="chip" id="lTrash">🗑 휴지통</button></div>' +
    '<div class="count" id="cnt"></div><div class="list" id="lst"><div class="loading">불러오는 중…</div></div>';
  $("bk").onclick = function(){ showHome(); };
  $("lTour").onclick = function(){ var rows = sortRows(filtered()); if (!rows.length) { toast("먼저 답사할 매물을 검색해 주세요."); return; } startTourFrom(rows); };
  $("lTrash").onclick = function(){ showListTrash(); };

// [매물v1.5] 빠르게: 처음 40개만 그리고, 내리면 40개씩 더 (사진이 많아서 한꺼번에 그리면 느림)
var LIST_ROWS = [], LIST_SHOWN = 0, LIST_STEP = 40, LIST_OBS = null;
var THUMBS = {};      // 매물 id → 첫 사진 (목록에 보일 때 몇십 개씩 묶어서 받음)
function thumbOf(it){
  if (it.photo_url) {
    if (it._thFor !== it.photo_url) { var ph = photosOf(it.photo_url); it._th = ph.length ? ph[0] : ""; it._thFor = it.photo_url; }
    return it._th;
  }
  var t = THUMBS[it.id];
  if (t === undefined) return it.photo_count ? null : "";      // null = 아직 안 받음
  return t;
}
function rowHtml(it){
  var th = thumbOf(it);
  return '<button class="item" data-id="' + esc(it.id) + '">' +
    (th ? '<img class="thumb" loading="lazy" src="' + esc(th) + '" alt="">'
        : (th === null ? '<img class="thumb" data-th="' + esc(it.id) + '" alt="">' : '<div class="noimg">사진 없음</div>')) +
    '<div class="info"><div class="nm">' + esc(it.name || "(이름 없음)") + '</div>' +
    '<div class="pr">' + (it.deal_type ? '<span class="badge b-deal">' + esc(it.deal_type) + '</span>' : '') + esc(it.price) + '</div>' +
    '<div class="ln">' + (dongOf(it) ? '<b>' + esc(dongOf(it)) + '</b> · ' : '') + esc(it.location) + '</div>' +
    '<div class="ln">' + esc(it.room_structure) + ' ' + statusBadge(stat(it)) + '</div></div></button>';
}
function drawRows(){
  if (!$("lst")) return;
  var rows = LIST_ROWS = sortRows(filtered());
  $("cnt").innerHTML = (Q.trim() ? '"' + esc(Q.trim()) + '" ' : '') + '<b>' + rows.length + '</b>건' +
    (SORT !== "new" ? ' <span class="hint">· ' + (LAST_RENT ? '월세 금액' : '매매가·보증금') + ' 기준</span>' : '') +
    (SYNCING ? ' <span class="hint">· ⟳ 최신 목록 받는 중</span>' : '');
  LIST_SHOWN = 0;
  if (!rows.length) { $("lst").innerHTML = '<div class="empty">조건에 맞는 매물이 없어요.</div>'; return; }
  $("lst").innerHTML = "";
  moreRows();
}
var THUMB_WAIT = {};
function loadThumbs(rows){
  var ids = rows.filter(function(it){ return thumbOf(it) === null && !THUMB_WAIT[it.id]; }).map(function(it){ return String(it.id); });
  if (!ids.length) return;
  ids.forEach(function(id){ THUMB_WAIT[id] = 1; });
  call("appThumbs", PIN, ids).then(function(map){
    ids.forEach(function(id){
      delete THUMB_WAIT[id];
      var raw = (map || {})[id] || "", src = raw ? (photosOf(raw)[0] || "") : "";
      THUMBS[id] = src;
      Array.prototype.forEach.call(document.querySelectorAll('img[data-th="' + id + '"]'), function(img){
        if (src) { img.src = src; img.removeAttribute("data-th"); }
        else { var d = document.createElement("div"); d.className = "noimg"; d.textContent = "사진 없음"; img.parentNode.replaceChild(d, img); }
      });
    });
  }).catch(function(){ ids.forEach(function(id){ delete THUMB_WAIT[id]; }); });
}
function moreRows(){
  var box = $("lst"); if (!box) return;
  var old = $("lmore"); if (old) old.parentNode.removeChild(old);
  var part = LIST_ROWS.slice(LIST_SHOWN, LIST_SHOWN + LIST_STEP);
  LIST_SHOWN += part.length;
  box.insertAdjacentHTML("beforeend", part.map(rowHtml).join(""));
  Array.prototype.forEach.call(box.querySelectorAll(".item:not([data-b])"), function(b){
    b.setAttribute("data-b", "1");
    b.onclick = function(){ showDetail(b.getAttribute("data-id")); };
  });
  loadThumbs(part);
  if (LIST_SHOWN < LIST_ROWS.length) {
    box.insertAdjacentHTML("beforeend", '<button class="btn ghost" id="lmore">▼ ' + (LIST_ROWS.length - LIST_SHOWN) + '건 더 보기</button>');
    $("lmore").onclick = moreRows;
    try {
      if (LIST_OBS) LIST_OBS.disconnect();
      LIST_OBS = new IntersectionObserver(function(es){ if (es[0].isIntersecting) { LIST_OBS.disconnect(); moreRows(); } }, { rootMargin: "400px" });
      LIST_OBS.observe($("lmore"));
    } catch (e) {}
  }
}

var BOX = { list: [], i: 0 };
var Z = { s: 1, x: 0, y: 0 };
function applyZoom(){ $("boxImg").style.transform = "translate(" + Z.x + "px," + Z.y + "px) scale(" + Z.s + ")"; }
function resetZoom(){ Z = { s: 1, x: 0, y: 0 }; applyZoom(); }
function clampPan(){
  var img = $("boxImg"); var w = img.offsetWidth * Z.s, h = img.offsetHeight * Z.s;
  var mx = Math.max(0, (w - window.innerWidth) / 2), my = Math.max(0, (h - window.innerHeight) / 2);
  Z.x = Math.min(mx, Math.max(-mx, Z.x)); Z.y = Math.min(my, Math.max(-my, Z.y));
}
function drawBox(){
  resetZoom();
  $("boxImg").src = BOX.list[BOX.i] || "";
  var many = BOX.list.length > 1;
  $("bxPrev").hidden = !many; $("bxNext").hidden = !many;

function stepBox(d){ if (!BOX.list.length) return; BOX.i = (BOX.i + d + BOX.list.length) % BOX.list.length; drawBox(); }

$("box").onclick = function(e){ if (e.target === $("box") && Z.s === 1) closeBox(); };
(function(){
  var box = $("box");
  var t0 = null, pinch = null, lastTap = 0, moved = false;
  function dist(a, b){ return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
  box.addEventListener("touchstart", function(e){
    if (e.target.tagName === "BUTTON") return;
    if (e.touches.length === 2) {
      pinch = { d: dist(e.touches[0], e.touches[1]), s: Z.s }; t0 = null;
    } else if (e.touches.length === 1) {
      t0 = { x: e.touches[0].clientX, y: e.touches[0].clientY, zx: Z.x, zy: Z.y }; moved = false;
    }
  }, { passive: true });
  box.addEventListener("touchmove", function(e){
    if (e.target.tagName === "BUTTON") return;
    e.preventDefault();
    if (pinch && e.touches.length === 2) {
      Z.s = Math.min(5, Math.max(1, pinch.s * dist(e.touches[0], e.touches[1]) / pinch.d));
      clampPan(); applyZoom();
    } else if (t0 && e.touches.length === 1) {
      var dx = e.touches[0].clientX - t0.x, dy = e.touches[0].clientY - t0.y;
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
      if (Z.s > 1) { Z.x = t0.zx + dx; Z.y = t0.zy + dy; clampPan(); applyZoom(); }
    }
  }, { passive: false });
  box.addEventListener("touchend", function(e){
    if (e.target.tagName === "BUTTON") return;
    if (pinch) { if (e.touches.length < 2) { pinch = null; if (Z.s < 1.05) resetZoom(); } t0 = null; return; }
    if (!t0) return;
    var dx = e.changedTouches[0].clientX - t0.x;
    if (!moved) {
      var now = Date.now();
      if (now - lastTap < 300) { // 두 번 톡톡: 확대/원래대로
        if (Z.s > 1) resetZoom(); else { Z.s = 2.5; clampPan(); applyZoom(); }
        lastTap = 0;
      } else lastTap = now;
    } else if (Z.s === 1 && Math.abs(dx) > 50) {
      stepBox(dx < 0 ? 1 : -1);
    }
    t0 = null;
  });
  box.addEventListener("wheel", function(e){ // PC 마우스 휠
    e.preventDefault();
    Z.s = Math.min(5, Math.max(1, Z.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
    if (Z.s < 1.05) resetZoom(); else { clampPan(); applyZoom(); }
  }, { passive: false });
})();

   PC가 브라우저로 이 화면을 열면서 주소 끝에 &tour=… 로 답사 순서를 보냄 → 그 순서로 답사를 만들어 바로 지도로 */
var URL_TOUR_DONE = false;
function checkUrlTour(){
  if (URL_TOUR_DONE) return false;
  URL_TOUR_DONE = true;
  try {
    if (!(window.google && google.script && google.script.url)) return false;
    google.script.url.getLocation(function(loc){
      var p = (loc && loc.parameter) || {};
      if (p.repair) {                     // 매물v2.5: PC [🔧 수리 견적] → 그 매물로 새 수리 견적
        load().then(function(){ var it = findItem(p.repair); if (it) rpStartFor(it); else showRepairHome(); }).catch(function(){ showRepairHome(); });
        return;
      }
      if (p.move) {                       // 매물v2.6: PC [🏠 입주·이사] → 그 매물로 새 입주·이사
        load().then(function(){ var it = findItem(p.move); if (it) mvStartFor(it); else showMoveHome(); }).catch(function(){ showMoveHome(); });
        return;
      }
      if (p.moves) { showMoveHome(); return; }
      if (p.sites) { showSiteHome(); return; }
      if (p.ai) { aiSettingsForm(); return; }
      if (p.repairs) { showRepairHome(false, p.repairs === "vendors" ? "vendors" : p.repairs === "prices" ? "prices" : "jobs"); return; }
      if (!p.tour) return;
      var d = null; try { d = JSON.parse(p.tour); } catch (e) {}
      if (!d || !d.items || !d.items.length) return;
      load().then(function(){ openTourFromPc(d); }).catch(function(){ openTourFromPc(d); });
    });
  } catch (e) {}
  return false;
}
function openTourFromPc(d){
  try { tourLoad(); } catch (e) {}
  var stops = [], miss = 0, k = 0;
  d.items.forEach(function(x){
    if (x.co) { k++; stops.push({ key: "C:" + Date.now() + "_" + k, co: { name: x.name || "", addr: x.addr || "", price: x.price || "", room: x.room || "" }, react: "", good: "", bad: "", ask: "", dir: "", seen: false }); return; }
    var it = findItem(x.id);
    if (it) stops.push(newStop(it)); else miss++;
  });
  if (!stops.length) { toast("PC에서 보낸 집을 찾지 못했어요."); return; }
  if (TOUR && TOUR.stops && TOUR.stops.length && !confirm("PC 답사 순서표의 " + stops.length + "곳으로 지도를 열까요?\n(이 브라우저에 있던 답사 " + TOUR.stops.length + "곳은 바뀌어요)")) return;
  TOUR = newTour(); TOUR.stops = stops; TOUR.coSeq = k; TOUR.cur = 0; TOUR.tab = "map";
  if (d.name) TOUR.routeName = String(d.name);
  KMAP.sel = 0; tourSave(); showTour();
  if (miss) toast("지워졌거나 못 찾은 집 " + miss + "곳은 빠졌어요.");
}

function custKinds(c){
  var ks = custRoles(c).map(function(r){ return ROLE_TO_KIND[r]; }).filter(function(k){ return CUST_KIND_WORDS[k]; });
  return ks.length ? ks : [null];
}
function man(t){ var k = priceKey(t); return k ? k[0] : 0; }
function fmtShort(m){
  m = Math.round(m || 0); if (!m) return "0";
  var eok = Math.floor(m / 10000), rest = m % 10000, out = eok ? eok + "억" : "";
  if (rest) { var ch = Math.floor(rest / 1000), bk = Math.floor((rest % 1000) / 100), r3 = rest % 100;
    out += r3 ? (eok ? String(rest) : rest + "만") : ((ch ? ch + "천" : "") + (bk ? bk + "백" : "")); }
  return out;
}
function custBudget(c){
  var b = man(c["최대예산"]); if (b) return b;
  return man(c["보유현금"]) + man(c["대출계획"]);
}
function canBuyText(c){
  var a = man(c["보유현금"]), b = man(c["대출계획"]);
  if (!a && !b) return "";
  return "현금 " + fmtShort(a) + " + 대출 " + fmtShort(b) + " = " + fmtShort(a + b) + "까지";
}
function parseRooms(t){
  var s = norm(t), m = s.match(/방(\d)/) || s.match(/(\d)방/), b = s.match(/화(\d)/);
  return [m ? Number(m[1]) : null, b ? Number(b[1]) : null];
}
function custMatchKind(c, it, kind){
  var score = 0, why = [];
  var deal = cnorm(it.deal_type), name = cnorm(it.name);
  var words = CUST_KIND_WORDS[kind];
  if (words) {
    var hayK = deal + (kind === "상가" ? name : "");
    if (words.some(function(w){ return hayK.indexOf(w) >= 0; })) { score += 3; why.push(kind); }
    else if (deal) return null;
  }
  var regions = String(c["지역"] || "").split(/[,/·]/).map(cnorm).filter(Boolean);
  if (regions.length) {
    var addr = cnorm(it.location) + name + cnorm(it.dong), hit = null;
    for (var i = 0; i < regions.length; i++) if (addr.indexOf(regions[i]) >= 0) { hit = regions[i]; break; }
    if (!hit) return null;
    score += 3; why.push(hit);
  }
  var want = parseRooms(c["방구조"]), has = parseRooms((it.room_structure || "") + " " + (it.name || ""));
  if (want[0] && has[0]) { if (has[0] < want[0]) return null; score += 2; why.push("방" + has[0]); }
  if (want[1] && has[1] && has[1] >= want[1]) { score += 1; why.push("화" + has[1]); }
  var budget = custBudget(c), price = priceKey(it.price);
  if (price && /매매/.test(it.deal_type || "") && price[0] < 1000 && String(it.price).indexOf("/") < 0) price = [price[0] * 100, price[1]];
  if (budget && price) {
    if (price[0] <= budget) { score += 2; why.push("예산 안"); }
    else if (price[0] <= budget * 1.1) { score += 1; why.push("예산 10%내 초과"); }
    else return null;
  }
  var mm = priceKey(c["최대월세"]);
  if (kind === "월세" && mm && price && price[1]) {
    if (price[1] <= mm[0]) { score += 1; why.push("월세 안"); } else return null;
  }
  return { score: score, why: why };
}
function custMatch(c, it){
  var best = null;
  custKinds(c).forEach(function(k){ var m = custMatchKind(c, it, k); if (m && (!best || m.score > best.score)) best = m; });
  return best;
}
function custMatches(c){
  var out = [];
  CLISTINGS.forEach(function(it){
    if (stat(it) !== "진행중") return;
    var m = custMatch(c, it); if (m) out.push({ it: it, m: m });
  });
  return out.sort(function(a, b){ return b.m.score - a.m.score; });
}
function custHay(c){
  return norm(["이름", "전화번호", "직업", "역할", "종류", "지역", "방구조", "최대예산", "최대월세", "입주시기", "꼭필요한것", "메모", "문의경로"]
    .map(function(k){ return c[k] || ""; }).concat([custStat(c)]).concat((c["기록"] || []).map(function(r){ return r["내용"]; })).join(" "));
}
// 붙여 쓴 검색어를 조각(2글자 이상, 최대 4조각)으로 나눠 모두 들어 있으면 OK — PC 프로그램과 같은 방식
function tokenIn(t, h){
  if (h.indexOf(t) >= 0) return true;
  var n = t.length, best = [0];
  for (var i = 1; i <= n; i++) best.push(99);
  for (var i = 2; i <= n; i++) for (var j = 0; j <= i - 2; j++)
    if (best[j] + 1 < best[i] && h.indexOf(t.slice(j, i)) >= 0) best[i] = best[j] + 1;
  return best[n] <= 4;
}
function custSave(c){
  return call("appCustSave", PIN, c).then(function(list){ CUSTS = list || CUSTS; });
}

function drawCustList(){
  if (!$("clst")) return;
  var live = CUSTS.filter(function(c){ return !custTrash(c); });
  function chipRow(elId, opts, cur, set, counter){
    $(elId).innerHTML = opts.map(function(s){ return '<button class="chip' + (s === cur ? ' on' : '') + '" data-s="' + esc(s) + '">' + esc(s) + (counter ? ' ' + counter(s) : '') + '</button>'; }).join("");
    Array.prototype.forEach.call($(elId).querySelectorAll(".chip"), function(b){ b.onclick = function(){ set(b.getAttribute("data-s")); drawCustList(); }; });
  }
  chipRow("cstats", CUST_STATUSES.concat(["전체"]), CSTAT, function(v){ CSTAT = v; },
    function(s){ return s === "전체" ? live.length : live.filter(function(c){ return custStat(c) === s; }).length; });
  chipRow("croles", ["전체"].concat(CUST_ROLES), CROLE, function(v){ CROLE = v; });
  var ntrash = CUSTS.length - live.length;
  $("ctrash").textContent = "🗑 휴지통 " + ntrash;
  var ts = tokens(CQ);
  var rows = live.filter(function(c){
    if (CSTAT !== "전체" && custStat(c) !== CSTAT) return false;
    if (CROLE !== "전체" && custRoles(c).indexOf(CROLE) < 0) return false;
    if (!ts.length) return true;
    var h = custHay(c);
    return ts.every(function(x){ return tokenIn(x, h); });
  }).sort(function(a, b){
    var ka = (lastRec(a) || {})["시각"] || a["등록일"] || "", kb = (lastRec(b) || {})["시각"] || b["등록일"] || "";
    return kb.localeCompare(ka);
  });
  $("ccnt").innerHTML = '<b>' + rows.length + '</b>명';
  if (!rows.length) { $("clst").innerHTML = '<div class="empty">조건에 맞는 고객이 없어요.</div>'; return; }
  $("clst").innerHTML = rows.slice(0, 200).map(function(c){
    var lr = lastRec(c), b = custBudget(c);
    return '<button class="item" data-id="' + esc(c.id) + '"><div class="info">' +
      '<div class="nm">' + custRoles(c).map(function(r){ return '<span class="badge b-kind">' + esc(r) + '</span>'; }).join("") + esc(c["이름"] || c["전화번호"] || "(이름 없음)") + '</div>' +
      '<div class="ln">' + esc([c["지역"], c["방구조"], b ? "~" + fmtShort(b) : ""].filter(Boolean).join(" · ")) + '</div>' +
      (lr ? '<div class="ln">' + esc(String(lr["날짜"]).slice(5)) + ' ' + esc(lr["내용"]) + '</div>' : '') +
      '</div></button>';
  }).join("");
  Array.prototype.forEach.call($("clst").querySelectorAll(".item"), function(b){ b.onclick = function(){ showCustDetail(b.getAttribute("data-id")); }; });
}

function custFieldHtml(f, c){
  var key = f[0], label = f[1], kind = f[2], opt = f[3], id = "cf_" + key;
  var v = key === "상태" ? custStat(c) : (c[key] || "");
  var lab = label ? '<label for="' + id + '">' + esc(label) + '</label>' : '';
  if (kind === "e") return lab + '<input id="' + id + '" value="' + esc(v) + '" placeholder="' + esc(opt || "") + '"' + (key === "전화번호" ? ' type="tel" inputmode="tel"' : '') + '>';
  if (kind === "s") return lab + '<input id="' + id + '" list="' + id + '_l" value="' + esc(v) + '"><datalist id="' + id + '_l">' + opt.map(function(o){ return '<option value="' + esc(o) + '">'; }).join("") + '</datalist>';
  if (kind === "t") return lab + '<textarea id="' + id + '" rows="3" placeholder="' + esc(opt || "") + '">' + esc(v) + '</textarea>';
  if (kind === "r") return lab + '<div class="stat" id="' + id + '" data-v="' + esc(v) + '">' + opt.map(function(o){
      return '<button type="button" class="chip' + (o === v ? ' on' : '') + '" data-o="' + esc(o) + '">' + esc(o) + '</button>'; }).join("") + '</div>';
  if (kind === "k") { var cur = custRoles(c); return '<div class="stat" id="' + id + '">' + opt.map(function(o){
      return '<button type="button" class="chip' + (cur.indexOf(o) >= 0 ? ' on' : '') + '" data-o="' + esc(o) + '">' + esc(o) + '</button>'; }).join("") + '</div>'; }
  return "";
}
function bindCustFields(){
  CUST_SECTIONS.forEach(function(sec){ sec[1].forEach(function(f){
    var el = $("cf_" + f[0]); if (!el) return;
    if (f[2] === "r") Array.prototype.forEach.call(el.querySelectorAll(".chip"), function(b){
      b.onclick = function(){ var on = b.classList.contains("on");
        Array.prototype.forEach.call(el.querySelectorAll(".chip"), function(x){ x.classList.remove("on"); });
        if (!on || f[0] === "상태") { b.classList.add("on"); el.setAttribute("data-v", b.getAttribute("data-o")); } else el.setAttribute("data-v", ""); };
    });
    if (f[2] === "k") Array.prototype.forEach.call(el.querySelectorAll(".chip"), function(b){ b.onclick = function(){ b.classList.toggle("on"); }; });
  }); });
}
function readCustFields(d){
  CUST_SECTIONS.forEach(function(sec){ sec[1].forEach(function(f){
    var el = $("cf_" + f[0]); if (!el) return;
    if (f[2] === "r") d[f[0]] = el.getAttribute("data-v") || "";
    else if (f[2] === "k") d["역할"] = Array.prototype.filter.call(el.querySelectorAll(".chip"), function(b){ return b.classList.contains("on"); })
        .map(function(b){ return b.getAttribute("data-o"); }).join(", ");
    else d[f[0]] = el.value.trim();
  }); });
  var first = custRoles(d).map(function(r){ return ROLE_TO_KIND[r]; }).filter(Boolean)[0];
  if (first) d["종류"] = first;
  return d;
}

    if (!isEdit && $("c_rec").value.trim()) d["기록"].push(rec($("c_rec").value.trim()));
    if (!isEdit && digits(d["전화번호"])) {
      var same = CUSTS.filter(function(x){ return digits(x["전화번호"]) === digits(d["전화번호"]); })[0];
      if (same && confirm("같은 전화번호의 고객이 이미 있어요.\n\n" + (same["이름"] || "") + " (" + custStat(same) + ")\n\n그 고객 카드에 지금 적은 내용을 합칠까요?\n[취소]를 누르면 새로 만들어요.")) {
        var m = JSON.parse(JSON.stringify(same));
        for (var k in d) if (k !== "id" && k !== "등록일" && k !== "기록" && k !== "상태" && d[k]) m[k] = d[k];
        m["기록"] = (m["기록"] || []).concat(d["기록"]);
        d = m;
      }
    }
    var b = this; b.disabled = true; b.textContent = "저장 중…";
    custSave(d).then(function(){ toast(isEdit ? "수정했어요." : "저장했어요."); showCustDetail(d.id); })
      .catch(function(e){ b.disabled = false; b.textContent = isEdit ? "수정 저장" : "등록하기"; $("cerr").textContent = errText(e); $("cerr").hidden = false; });
  };
}

/* ---------- 휴지통 (고객 · 매물) — 골라서 되살리기 / 영구 삭제 ---------- */
function trashView(title, rows, onBack, onRestore, onPurge){
  window.scrollTo(0, 0);
  $("app").innerHTML =
    '<div class="top"><button class="back" id="bk">← 돌아가기</button><h2>' + esc(title) + '</h2></div>' +
    '<div class="hint">줄을 눌러 ☑ 고른 뒤 아래 단추를 누르세요. 여러 개를 한 번에 할 수 있어요.</div>' +
    '<div class="chips" style="margin:8px 0"><button class="chip" id="tall">모두 고르기</button><button class="chip" id="tnone">모두 풀기</button></div>' +
    '<div class="list" id="tl">' + (rows.length ? rows.map(function(r){
      return '<button class="item" data-k="' + esc(r.key) + '"><div style="font-size:22px;width:28px" class="ck">☐</div><div class="info"><div class="nm">' + esc(r.title) + '</div><div class="ln">' + esc(r.sub) + '</div></div></button>';
    }).join("") : '<div class="empty">휴지통이 비어 있어요.</div>') + '</div>' +
    '<button class="btn" id="tres">♻ 고른 것 되살리기</button><button class="btn danger" id="tdel">고른 것 영구 삭제</button>';
  var sel = {};
  function paint(){ Array.prototype.forEach.call($("tl").querySelectorAll(".item"), function(b){ b.querySelector(".ck").textContent = sel[b.getAttribute("data-k")] ? "☑" : "☐"; }); }
  Array.prototype.forEach.call($("tl").querySelectorAll(".item"), function(b){ b.onclick = function(){ var k = b.getAttribute("data-k"); sel[k] = !sel[k]; paint(); }; });
  $("tall").onclick = function(){ rows.forEach(function(r){ sel[r.key] = true; }); paint(); };
  $("tnone").onclick = function(){ sel = {}; paint(); };
  function chosen(){ return rows.filter(function(r){ return sel[r.key]; }).map(function(r){ return r.key; }); }
  $("bk").onclick = onBack;
  $("tres").onclick = function(){ var ks = chosen(); if (!ks.length) { toast("먼저 골라 주세요."); return; } this.disabled = true; onRestore(ks); };
  $("tdel").onclick = function(){ var ks = chosen(); if (!ks.length) { toast("먼저 골라 주세요."); return; }
    if (!confirm("고른 " + ks.length + "개를 영구 삭제할까요?\n영구 삭제하면 되살릴 수 없어요.")) return; this.disabled = true; onPurge(ks); };
}
function showCustTrash(fromHist){
  if (!fromHist) nav("ctrash");
  var rows = CUSTS.filter(custTrash).map(function(c){
    return { key: String(c.id), title: (c["이름"] || "(이름 없음)") + " " + (c["전화번호"] || ""), sub: custRoles(c).join(", ") + " · 예전 상태: " + (String(c["상태"]).slice(4) || "상담중") };
  });
  trashView("🗑 고객 휴지통 " + rows.length, rows, function(){ showCustList(); }, function(ks){
    var p = Promise.resolve();
    ks.forEach(function(k){ var c = findCust(k); if (!c) return;
      var c2 = JSON.parse(JSON.stringify(c)); c2["상태"] = String(c["상태"]).slice(4) || "상담중"; c2["기록"] = (c2["기록"] || []).concat([rec("휴지통에서 되살림")]);
      p = p.then(function(){ return custSave(c2); }); });
    p.then(function(){ toast(ks.length + "명을 되살렸어요."); showCustTrash(true); }).catch(function(e){ toast(errText(e)); showCustTrash(true); });

    p.then(function(){ toast("영구 삭제했어요."); showCustTrash(true); }).catch(function(e){ toast(errText(e)); showCustTrash(true); });
  });
}
function showListTrash(fromHist){
  if (!fromHist) nav("ltrash");
  var rows = ITEMS.filter(function(it){ return stat(it) === "휴지통"; }).map(function(it){
    return { key: String(it.id), title: it.name || "(이름 없음)", sub: (it.price || "") + " · " + (dongOf(it) || it.location || "") + " · 예전 상태: " + (String(it.status).slice(4) || "진행중") };
  });
  trashView("🗑 매물 휴지통 " + rows.length, rows, function(){ showList(); }, function(ks){

      .catch(function(e){ toast(errText(e)); showListTrash(true); });
  }, function(ks){
    var p = Promise.resolve();
    ks.forEach(function(k){ p = p.then(function(){ return call("appDelete", PIN, k); }); });
    p.then(function(){ return load(); }).then(function(){ toast("영구 삭제했어요."); showListTrash(true); }).catch(function(e){ toast(errText(e)); showListTrash(true); });
  });
}

/* ==========================================================
   🚶 답사 (핸드폰) — 매물v1.4
   · [🚶 답사 순서] / [👤 고객정보] 두 칸 (마지막에 고른 쪽 기억)
   · 아무 집이나 "여기 보는 중"으로 되돌아가기, [다음 ▶]은 아직 안 본 집으로, 본 순서 기록
   · 답사 중 ↑↓, ＋ 집 더하기, ＋ 공동중개 물건, 빼기(메모는 보관 → 다시 넣기)
   · 🧭 방향 재기 (센서가 막히면 8방향 단추) → 답사 메모 + 매물 '방향' 칸
   진행 중인 답사는 이 핸드폰에 잠시 저장 → 화면을 나갔다 와도 이어짐
   ========================================================== */
var TOUR = null;
var TOUR_CUST_FIELDS = [["이름", "이름"], ["전화번호", "전화번호"], ["직업", "직업"], ["결혼", "결혼 (미혼/기혼/결혼 예정)"], ["식구수", "식구 수"],
                        ["자녀수", "자녀 수"], ["연봉본인", "연봉"], ["보유현금", "보유 현금"], ["대출계획", "대출 계획"], ["신용점수", "신용점수"],
                        ["지역", "원하는 동네"], ["방구조", "원하는 방 구조"], ["최대예산", "예산"], ["입주시기", "입주 시기"], ["꼭필요한것", "꼭 필요한 것"]];
var DIR8 = ["북", "북동", "동", "남동", "남", "남서", "서", "북서"];
var DIR_BASES = ["거실", "안방", "작은방", "베란다", "주방", "출입구"];
var KR_DECLINATION = -8.5;   // 우리나라 편각: 나침반 북쪽이 지도 북쪽보다 약 8.5° 서쪽

function tourSave(){ try { localStorage.setItem("mm_tour", JSON.stringify(TOUR)); } catch (e) {} }
function tourLoad(){
  try { var t = JSON.parse(localStorage.getItem("mm_tour") || "null"); if (t && t.stops) TOUR = tourFix(t); } catch (e) {}
}
function tourClear(){ TOUR = null; try { localStorage.removeItem("mm_tour"); } catch (e) {} }
function tourFix(t){   // 예전(v1.3) 답사 자료도 그대로 이어지게
  t.removed = t.removed || []; t.log = t.log || []; t.cust = t.cust || {}; t.coSeq = t.coSeq || 0;
  t.tab = t.tab || prefTab();
  t.stops.concat(t.removed).forEach(function(s){ if (!s.key) s.key = "L:" + s.id; });
  if (t.fav1 && /^\d+$/.test(t.fav1)) t.fav1 = (t.stops[+t.fav1 - 1] || {}).key || "";
  if (t.fav2 && /^\d+$/.test(t.fav2)) t.fav2 = (t.stops[+t.fav2 - 1] || {}).key || "";
  return t;
}
function prefTab(){ try { return localStorage.getItem("mm_tour_tab") || "order"; } catch (e) { return "order"; } }
function naverMap(addr){ return "https://map.naver.com/p/search/" + encodeURIComponent(addr || ""); }
function newTour(){ return { stops: [], removed: [], cust: {}, custId: "", cur: 0, fav1: "", fav2: "", note: "", log: [], coSeq: 0, tab: prefTab() }; }
function newStop(it){ return { key: "L:" + it.id, id: String(it.id), react: "", good: "", bad: "", ask: "", dir: "", seen: false }; }

// 카드에 보일 내용 (우리 매물 / 공동중개 물건)
function stopInfo(s){
  if (s.co) {
    var c = s.co;
    return { co: true, name: c.name || "(공동중개 물건)", price: c.price || "", addr: c.addr || "", room: c.room || "",
             who: c.office || "", tel: c.tel || "", pws: [["공동현관", c.pw1], ["세대", c.pw2]].filter(function(x){ return x[1]; }), memo: c.memo || "", dir: s.dir || "" };
  }
  var it = findItem(s.id) || {};
  return { co: false, name: it.name || "(지워진 매물)", price: it.price || "", addr: it.location || dongOf(it) || "", room: it.room_structure || "",
           who: it.client_name || "", tel: it.phone || "", pws: it.password ? [["비밀번호", it.password]] : [], memo: "", dir: s.dir || it.direction || "" };
}
function setCur(i){
  var s = TOUR.stops[i]; if (!s) return;
  TOUR.insAt = null;
  TOUR.cur = i; s.seen = true;
  if (TOUR.log[TOUR.log.length - 1] !== s.key) TOUR.log.push(s.key);
}
function nextUnseen(){
  var n = TOUR.stops.length;
  for (var k = 1; k < n; k++) { var i = (TOUR.cur + k) % n; if (!TOUR.stops[i].seen) return i; }
  return -1;
}
function scrollToStop(i, where){ setTimeout(function(){ var el = $("stop" + i); if (el) el.scrollIntoView({ block: where || "start" }); }, 40); }

/* ---------- 시작: 목록에서 고른 매물로 / 첫 화면에서 빈 답사로 ---------- */
function resumeAsk(){
  tourLoad();
  return TOUR && (TOUR.stops.length || TOUR.removed.length) &&
    confirm("하던 답사가 있어요 (" + TOUR.stops.length + "곳). 이어서 할까요?\n[취소]를 누르면 새로 시작해요.");
}
function startTourFrom(rows){
  if (resumeAsk()) { showTour(); return; }
  TOUR = newTour();
  TOUR.pick = rows.slice(0, 60).map(function(it, i){ return { id: String(it.id), on: i < 6 }; });
  tourSave();
  showTourPick();
}
function startTourHome(){
  var go = LOADED ? Promise.resolve() : load();
  go.then(function(){
    if (resumeAsk()) { showTour(); return; }
    TOUR = newTour(); TOUR.tab = "add"; tourSave();
    toast("[＋ 집 더하기]로 보여 줄 집을 넣으세요.");
    showTour();
  }).catch(function(e){ toast(errText(e)); });
}
function showTourPick(fromHist){
  if (!fromHist) nav("tpick");
  if (!TOUR || !TOUR.pick) { tourLoad(); if (!TOUR || !TOUR.pick) { showList(); return; } }
  window.scrollTo(0, 0);
  var p = TOUR.pick;
  $("app").innerHTML =
    '<div class="top"><button class="back" id="bk">← 목록</button><h2>🚶 답사 순서 정하기</h2></div>' +
    '<div class="hint">넣을 매물을 누르고(번호), ↑↓로 도는 순서를 맞추세요. 답사 중에도 넣고 빼고 순서를 바꿀 수 있어요.</div>' +
    '<div class="list" id="tp" style="margin-top:8px">' + p.map(function(x, i){
      var it = findItem(x.id) || {};
      var no = p.slice(0, i + 1).filter(function(y){ return y.on; }).length;
      return '<div class="item" style="align-items:center"><button class="chip' + (x.on ? ' on' : '') + '" data-t="' + i + '" style="min-width:44px">' + (x.on ? no : "－") + '</button>' +
        '<div class="info" data-t="' + i + '"><div class="nm">' + esc(it.name || "") + '</div><div class="ln">' + esc(it.price || "") + ' · ' + esc(dongOf(it)) + '</div></div>' +
        '<button class="mini" data-u="' + i + '">↑</button><button class="mini" data-d="' + i + '">↓</button></div>';
    }).join("") + '</div>' +
    '<button class="btn" id="tgo">🚶 답사 시작 (' + p.filter(function(x){ return x.on; }).length + '곳)</button>';
  $("bk").onclick = function(){ showList(); };
  Array.prototype.forEach.call($("tp").querySelectorAll("[data-t]"), function(b){ b.onclick = function(){ var i = +b.getAttribute("data-t"); p[i].on = !p[i].on; tourSave(); showTourPick(true); }; });
  Array.prototype.forEach.call($("tp").querySelectorAll("[data-u]"), function(b){ b.onclick = function(){ var i = +b.getAttribute("data-u"); if (i > 0) { var t = p[i]; p[i] = p[i - 1]; p[i - 1] = t; tourSave(); showTourPick(true); } }; });
  Array.prototype.forEach.call($("tp").querySelectorAll("[data-d]"), function(b){ b.onclick = function(){ var i = +b.getAttribute("data-d"); if (i < p.length - 1) { var t = p[i]; p[i] = p[i + 1]; p[i + 1] = t; tourSave(); showTourPick(true); } }; });
  $("tgo").onclick = function(){
    var on = p.filter(function(x){ return x.on; });
    if (!on.length) { toast("넣을 매물을 골라 주세요."); return; }
    TOUR.stops = on.map(function(x){ return newStop(findItem(x.id) || { id: x.id }); });
    delete TOUR.pick;
    TOUR.cur = 0; TOUR.log = []; setCur(0); tourSave();
    (CLOADED ? Promise.resolve() : custLoad().catch(function(){})).then(function(){ showTour(); });
  };
}

/* ---------- 답사 화면 ---------- */
function showTour(fromHist){
  if (!fromHist) nav("tour");
  if (!TOUR) { tourLoad(); if (!TOUR) { showList(); return; } }
  if (!CLOADED) custLoad().then(function(){ if (CUR.view === "tour" && TOUR && TOUR.tab === "cust") showTour(true); }).catch(function(){});
  var tab = TOUR.tab || "order";
  var head =
    '<div class="top"><button class="back" id="bk">← 목록</button><h2>' + ic("walk") + ' 답사 ' + TOUR.stops.length + '곳</h2></div>' +
    '<div class="seg"><button id="tabO" class="' + (tab === "order" || tab === "add" || tab === "co" || tab === "routes" || tab === "photo" || tab === "map" ? "on" : "") + '">🚶 답사 순서</button>' +
    '<button id="tabC" class="' + (tab === "cust" ? "on" : "") + '">👤 고객정보</button></div>';

  $("app").innerHTML = head + body;

  $("tabC").onclick = function(){ TOUR.tab = "cust"; TOUR.backTo = null; try { localStorage.setItem("mm_tour_tab", "cust"); } catch (e) {} tourSave(); showTour(true); window.scrollTo(0, 0); };
  if (tab === "cust") bindTourCust(); else if (tab === "add") bindTourAdd(); else if (tab === "co") bindTourCo(); else if (tab === "routes") bindTourRoutes(); else if (tab === "photo") bindTourPhoto(); else if (tab === "map") bindTourMap(); else bindTourOrder();
}

  html += st.map(function(s, i){

        (f.addr ? row("pin", '<a href="' + esc(naverMap(f.addr)) + '" target="_blank" style="color:inherit">' + esc(f.addr) + '</a>',

        f.pws.map(function(pw){ return row("key", esc(pw[0]) + ' <b class="pwv" data-p="' + esc(pw[1]) + '" style="letter-spacing:1px">••••</b>', '<button class="mini pwb">보기</button>'); }).join("") +
        (f.memo ? row("clipboard", esc(f.memo)) : '') +

function startCompass(){
  var got = false;
  function onEv(e){
    var h = null;
    if (typeof e.webkitCompassHeading === "number" && !isNaN(e.webkitCompassHeading)) h = e.webkitCompassHeading;   // 아이폰

    }
    if (h == null || !CMP) return;

    got = true;
    var sm = (Math.atan2(CMP.y, CMP.x) * 180 / Math.PI + 360) % 360;
    CMP.h = sm;
    if ($("cmpV")) {
      $("cmpV").innerHTML = '<b>' + dirName(sm) + '향</b> <span>' + Math.round(sm) + '°</span>';
      $("cmpN").style.transform = "rotate(" + (-sm) + "deg)";
      $("cmpSave").disabled = false;
    }
  }
  var evName = ("ondeviceorientationabsolute" in window) ? "deviceorientationabsolute" : "deviceorientation";
  function attach(){ window.addEventListener(evName, onEv, true); }
  CMP.stop = function(){ window.removeEventListener(evName, onEv, true); };
  try {
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission().then(function(r){ if (r === "granted") attach(); else fail(); }).catch(fail);
    } else attach();
  } catch (e) { fail(); }
  function fail(){
    if (!CMP || got) return;
    if ($("cmpV")) $("cmpV").innerHTML = '<span style="font-size:15px">이 화면에서는 나침반을 쓸 수 없어요.<br>핸드폰 나침반 앱으로 보고 아래 단추를 눌러 주세요.</span>';
    if ($("cmpRose")) $("cmpRose").style.display = "none";
    if ($("cmpSave")) $("cmpSave").style.display = "none";
  }
  setTimeout(fail, 3000);
}

/* ==========================================================
   📷 답사 칸별 사진 (매물v1.9)
   · 답사 카드의 [📷 칸별 사진] → 방1·화장실1·거실1… 칸을 누르면 바로 카메라, 찍으면 그 칸에 들어감

   · PC 프로그램을 켜면 PC가 받아 가고 시트에는 작은 미리보기만 남음
   ========================================================== */
var TP_STEPS = [[1400, .72], [1280, .68], [1152, .62], [1024, .58], [900, .55], [800, .5]];
var TP_PART = 48000, TP_PARTS = 4;
var SLOTS = null;               // 기본 칸 목록

/* ---------- 이 핸드폰에 담아 두기 (IndexedDB) ---------- */
var IDB = null;
function idb(){
  if (IDB) return IDB;
  IDB = new Promise(function(res, rej){
    try {
      var rq = indexedDB.open("mm_tphoto", 1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore("q", { keyPath: "id" }); };
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror = function(){ rej(rq.error); };
    } catch (e) { rej(e); }
  });
  return IDB;
}
function idbDo(mode, fn){
  return idb().then(function(db){ return new Promise(function(res, rej){
    var tx = db.transaction("q", mode), st = tx.objectStore("q"), out = fn(st);
    tx.oncomplete = function(){ res(out && out.result !== undefined ? out.result : out); };
    tx.onerror = function(){ rej(tx.error); };
  }); });
}
function qLoad(){ return idbDo("readonly", function(st){ return st.getAll(); }).then(function(a){ TPQ = a || []; return TPQ; }).catch(function(){ return TPQ; }); }
function qPut(x){ TPQ.push(x); return idbDo("readwrite", function(st){ st.put(x); }).catch(function(){}); }
function qDel(id){ TPQ = TPQ.filter(function(x){ return x.id !== id; }); return idbDo("readwrite", function(st){ st.delete(id); }).catch(function(){}); }

/* ---------- 사진 줄이기: 선명한 것(조각 나눔) + 아주 작은 미리보기 ---------- */
function tpEncode(file){
  return loadImg(file).then(function(img){
    var out = null;
    for (var i = 0; i < TP_STEPS.length; i++) {
      var w = img.naturalWidth, h = img.naturalHeight, r = Math.min(1, TP_STEPS[i][0] / Math.max(w, h));
      w = Math.max(1, Math.round(w * r)); h = Math.max(1, Math.round(h * r));
      var c = document.createElement("canvas"); c.width = w; c.height = h;
      var ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      out = c.toDataURL("image/jpeg", TP_STEPS[i][1]).split(",")[1];
      if (out.length <= TP_PART * TP_PARTS) break;
    }
    var tw = img.naturalWidth, th = img.naturalHeight, tr = Math.min(1, 160 / Math.max(tw, th));
    var t = document.createElement("canvas"); t.width = Math.max(1, Math.round(tw * tr)); t.height = Math.max(1, Math.round(th * tr));
    t.getContext("2d").drawImage(img, 0, 0, t.width, t.height);
    var thumb = t.toDataURL("image/jpeg", .5).split(",")[1];
    URL.revokeObjectURL(img.src);
    if (out.length > TP_PART * TP_PARTS) throw new Error("사진이 너무 커요. 다시 찍어 주세요.");
    var parts = []; for (var k = 0; k < out.length; k += TP_PART) parts.push(out.slice(k, k + TP_PART));
    return { parts: parts, thumb: thumb };
  });
}

function slotsLoad(){

function roomCounts(room){
  room = String(room || "");
  var b = room.match(/방\s*(\d+)/), w = room.match(/(?:화장실|욕실|화)\s*(\d+)/);
  return { bang: b ? +b[1] : 0, hwa: w ? +w[1] : 0 };
}
// 방 구조에 맞게: '방3화2' → 방1~3, 화장실1~2 (기본 목록의 방·화장실 자리에)
function slotsFor(s){
  var base = (SLOTS && SLOTS.length ? SLOTS : DEFAULT_SLOTS).slice();
  var room = s.co ? (s.co.room || "") : ((findItem(s.id) || {}).room_structure || "");
  var rc = roomCounts(room);
  function fit(prefix, n){
    if (!n) return;
    var re = new RegExp("^" + prefix + "\\d+$"), at = -1;
    base = base.filter(function(x, i){ if (re.test(x)) { if (at < 0) at = i; return false; } return true; });
    if (at < 0) at = base.length;
    var add = []; for (var k = 1; k <= n; k++) add.push(prefix + k);
    Array.prototype.splice.apply(base, [at, 0].concat(add));
  }
  if (base.indexOf("안방") >= 0) {
    // 매물v2.4 동선 목록: 안방 + 방2…방N, 거실화장실 + 안방화장실(+ 화장실3…)
    if (rc.bang) {
      var at = -1;
      base = base.filter(function(x, i){ if (/^방\d+$/.test(x)) { if (at < 0) at = i; return false; } return true; });
      if (at < 0) at = base.indexOf("거실 창밖") >= 0 ? base.indexOf("거실 창밖") + 1 : base.length;
      var add = []; for (var k = 2; k <= rc.bang; k++) add.push("방" + k);
      Array.prototype.splice.apply(base, [at, 0].concat(add));
    }
    if (rc.hwa === 1) base = base.filter(function(x){ return x !== "안방화장실"; });
    if (rc.hwa >= 3) {
      var j = base.indexOf("안방화장실"); if (j < 0) j = base.indexOf("거실화장실");
      var more = []; for (var h = 3; h <= rc.hwa; h++) if (base.indexOf("화장실" + h) < 0) more.push("화장실" + h);
      Array.prototype.splice.apply(base, [j + 1, 0].concat(more));
    }
  } else { fit("방", rc.bang); fit("화장실", rc.hwa); }
  (s.slotAdd || []).forEach(function(x){ if (base.indexOf(x) < 0) base.push(x); });

/* ---------- 주소 → 좌표 ---------- */
function addrTries(addr){
  addr = String(addr || "").trim();
  var out = [];
  if (!addr) return out;
  out.push(addr);
  var cut = addr.replace(/\(.*?\)/g, " ").replace(/\s+/g, " ").trim();
  var m = cut.match(/^(.*?\d+(?:-\d+)?)(?=\s|,|$)/);                 // 번지까지만 (뒤의 건물명·호수 빼기)
  if (m && out.indexOf(m[1]) < 0) out.push(m[1]);
  var region = String((OFFICE_INFO || {}).addr || "").split(/\s+/).slice(0, 2).join(" ");   // 시·구가 빠진 주소면 사무소 쪽 시·구를 붙여 봄
  var first = region.split(" ")[0];
  if (region && first && cut.indexOf(first) < 0 && !/^(서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)/.test(cut) && m) out.push(region + " " + m[1]);
  return out;
}
function geocode(addr){
  var key = String(addr || "").trim();
  if (!key) return Promise.resolve(null);
  if (KMAP.geo.hasOwnProperty(key)) return Promise.resolve(KMAP.geo[key]);
  var gc = new kakao.maps.services.Geocoder(), ps = new kakao.maps.services.Places();
  var tries = addrTries(key);
  function viaAddr(i){
    if (i >= tries.length) return viaPlace();
    return new Promise(function(res){
      gc.addressSearch(tries[i], function(r, st){
        if (st === kakao.maps.services.Status.OK && r && r[0]) res({ lat: +r[0].y, lng: +r[0].x });
        else if (st === kakao.maps.services.Status.ERROR) res("ERR");
        else res(null);
      });
    }).then(function(p){ return p === null ? viaAddr(i + 1) : p; });
  }
  function viaPlace(){
    return new Promise(function(res){
      ps.keywordSearch(key, function(r, st){ res(st === kakao.maps.services.Status.OK && r && r[0] ? { lat: +r[0].y, lng: +r[0].x } : null); });
    });
  }
  return viaAddr(0).then(function(p){
    if (p === "ERR") throw new Error("geocode");
    KMAP.geo[key] = p; return p;
  });
}
function stopAddr(s){ return stopInfo(s).addr || ""; }
function stopGeo(s){ var a = stopAddr(s).trim(); return a && KMAP.geo[a] ? KMAP.geo[a] : null; }
function kakaoRouteLink(s){
  var f = stopInfo(s), g = stopGeo(s);
  if (g) return "https://map.kakao.com/link/to/" + encodeURIComponent((f.name || "답사").replace(/,/g, " ")) + "," + g.lat + "," + g.lng;
  return "https://map.kakao.com/link/search/" + encodeURIComponent(f.addr || f.name || "");
}

/* ---------- 거리 · 가까운 순서 ---------- */
function kmDist(a, b){
  var R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
  var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}
function pathLen(start, pts){
  var d = 0, prev = start;
  pts.forEach(function(p){ if (prev) d += kmDist(prev, p); prev = p; });
  return d;
}
// 출발점에서 가까운 집부터 고르고(최근접), 순서를 뒤집어 보며 더 짧아지면 바꿈(2-opt)
function bestOrder(start, pts){
  var left = pts.map(function(p, i){ return i; }), order = [], cur = start;
  if (!cur && left.length) { order.push(left.shift()); cur = pts[order[0]]; }
  while (left.length) {
    var bi = 0, bd = Infinity;
    left.forEach(function(k, j){ var d = kmDist(cur, pts[k]); if (d < bd) { bd = d; bi = j; } });
    var k = left.splice(bi, 1)[0]; order.push(k); cur = pts[k];
  }
  var len = function(o){ return pathLen(start, o.map(function(k){ return pts[k]; })); };
  var improved = true, guard = 0, fixed = start ? 0 : 1;
  while (improved && guard++ < 60) {
    improved = false;
    for (var i = fixed; i < order.length - 1; i++) for (var j = i + 1; j < order.length; j++) {
      var o2 = order.slice(0, i).concat(order.slice(i, j + 1).reverse(), order.slice(j + 1));
      if (len(o2) + 1e-9 < len(order)) { order = o2; improved = true; }
    }
  }
  return order;
}

function kmSheetBind(){
  var h = $("kmHandle"), sh = $("kmSheet"); if (!h || !sh) return;
  var y0 = null, moved = false;
  h.onclick = function(){ if (moved) { moved = false; return; } kmSetMin(!KMAP.min); };
  function start(e){ y0 = (e.touches ? e.touches[0] : e).clientY; moved = false; }
  function end(e){
    if (y0 === null) return;
    var y1 = (e.changedTouches ? e.changedTouches[0] : e).clientY, dy = y1 - y0; y0 = null;
    if (dy > 30) { moved = true; kmSetMin(true); } else if (dy < -30) { moved = true; kmSetMin(false); }
  }
  [h, sh].forEach(function(el){
    el.addEventListener("touchstart", function(e){ if (el === sh && sh.scrollTop > 0) return; start(e); }, { passive: true });
    el.addEventListener("touchend", end, { passive: true });
  });

function kmSort(geos, sp){
  var st = TOUR.stops, idx = [], pts = [];
  st.forEach(function(s, i){ if (geos[i]) { idx.push(i); pts.push(geos[i]); } });
  if (pts.length < 2) { toast("지도에 찍힌 집이 2곳 이상이어야 정렬할 수 있어요."); return; }
  var start = sp ? sp.p : null;
  var ord = bestOrder(start, pts);
  var before = pathLen(start, pts), after = pathLen(start, ord.map(function(k){ return pts[k]; }));
  var same = ord.every(function(k, j){ return k === j; });
  if (same || after >= before - 0.05) { toast("지금 순서가 이미 가장 덜 돌아가는 순서예요."); return; }
  var newIdx = ord.map(function(k){ return idx[k]; });
  var rest = st.map(function(s, i){ return i; }).filter(function(i){ return !geos[i]; });
  var names = newIdx.map(function(i, j){ return (j + 1) + ". " + stopInfo(st[i]).name; }).join("\n");
  if (!confirm("가까운 순서로 바꿀까요?\n(곧게 잰 거리 " + before.toFixed(1) + "km → " + after.toFixed(1) + "km)\n\n" + names + (rest.length ? "\n\n지도에 못 찍은 " + rest.length + "곳은 맨 뒤로 가요." : ""))) return;
  var curKey = (st[TOUR.cur] || {}).key;
  TOUR.stops = newIdx.concat(rest).map(function(i){ return st[i]; });
  TOUR.cur = Math.max(0, TOUR.stops.map(function(s){ return s.key; }).indexOf(curKey));
  tourSave(); showTour(true); toast("가까운 순서로 바꿨어요. 잘 맞으면 💾 동선 저장도 해 두세요.");
}
