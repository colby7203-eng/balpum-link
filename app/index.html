/* ---------- 💰 대략 견적 계산 (직접 고르기) ---------- */
function rpPriceRows(kind){ return RP.prices.filter(function(p){ return p.kind === kind; }); }
function rpCalcOf(j, kind){
  var c = rpData(j).calc;
  var o = c.by[kind];
  if (!o) {
    var hasPy = rpPriceRows(kind).some(function(p){ return p.qty === "평" || p.unit === "평"; });
    o = c.by[kind] = { scope: hasPy ? "방 하나" : "", py: 3, qty: {} };
  }
  return o;
}
function rpQty(j, kind, p){
  var o = rpCalcOf(j, kind);
  if (o.qty.hasOwnProperty(p.item)) return Number(o.qty[p.item]) || 0;
  if (p.qty === "평") return Number(o.py) || 0;
  return Number(p.qty) || 0;
}
// 받은 실제 견적으로 고치는 비율 (그 종류 하나만 고른 견적의 최근 5건, 가운데 값 — 건수가 적으면 덜 반영)
function rpFactor(kind){
  var r = [];
  RP.jobs.forEach(function(j){
    if (!j.data || !j.data.quotes || j.types.length !== 1 || j.types[0] !== kind) return;
    j.data.quotes.forEach(function(q){ if (q.est > 0 && q.amount > 0) r.push({ at: q.at || "", v: q.amount / q.est }); });
  });
  r.sort(function(a, b){ return String(b.at).localeCompare(String(a.at)); });
  r = r.slice(0, 5).map(function(x){ return x.v; }).sort(function(a, b){ return a - b; });
  if (!r.length) return { f: 1, n: 0 };
  var mid = r.length % 2 ? r[(r.length - 1) / 2] : (r[r.length / 2 - 1] + r[r.length / 2]) / 2;
  mid = Math.max(.5, Math.min(2, mid));
  return { f: 1 + (mid - 1) * r.length / (r.length + 2), n: r.length };     // 건수가 적으면 조금만 반영 (1건 1/3 · 3건 3/5 · 5건 5/7)
}
function rpCalc(j){
  var c = rpData(j).calc, good = c.grade === "좋은 것";
  var out = { kinds: [], low: 0, high: 0 };
  j.types.forEach(function(kind){
    var fx = rpFactor(kind), rows = [], lo = 0, hi = 0;
    rpPriceRows(kind).forEach(function(p){
      var q = rpQty(j, kind, p); if (!q) return;
      var mid = (p.low + p.high) / 2;
      var a = (good ? mid : p.low) * q * fx.f, b = (good ? p.high : mid) * q * fx.f;
      rows.push({ item: p.item, unit: p.unit, qty: q, low: a, high: b }); lo += a; hi += b;
    });
    out.kinds.push({ kind: kind, rows: rows, low: lo, high: hi, fx: fx });
    out.low += lo; out.high += hi;
  });
  out.low = Math.round(out.low / 1000) * 1000; out.high = Math.round(out.high / 1000) * 1000;
  return out;
}

      else st.err = "검색을 못 했어요. 인터넷을 확인해 주세요.";

      ps.keywordSearch(g ? word : ((j.dong || "") + " " + word).trim(), function(r, s, pg){ (st._cb || done)(r, s, pg); }, opt);
    });

function rpUploadPhoto(j, ph){

    var j = rpJob(id);

    if (mvIsMove(j)) { showMove(j.id, true); return; }
    rpData(j);
    if (!RP.photos[j.id]) RP.photos[j.id] = [];
    drawRepair(j);
    rpFetchPhotos(j).then(function(){ if (CUR.view === "repair" && CUR.id === j.id) redrawRepair(j); }).catch(function(){});

function rpSentHtml(j){
  var d = rpData(j), html = "";

      return '<div class="item" style="flex-direction:column;gap:6px"><div style="display:flex;align-items:center"><div class="nm" style="flex:1;font-size:15px">' + esc(s.name) + '</div><span class="hint" style="margin:0">' + esc(String(s.at).slice(5, 16)) + '</span></div>' +
        '<div style="display:flex;gap:6px;align-items:center"><input data-qa="' + i + '" inputmode="decimal" placeholder="받은 금액 (만원)" value="' + (q ? esc(q.amount / 10000) : "") + '" style="flex:1;padding:8px 10px;font-size:15px">' +
        '<input data-qn="' + i + '" placeholder="' + (mv ? "조건 (포장·사다리차·날짜)" : "날짜 · 메모") + '" value="' + (q ? esc(q.note || "") : "") + '" style="flex:1.3;padding:8px 10px;font-size:15px"></div>' +
        '<div class="tools" style="justify-content:flex-start;margin:0"><button class="mini solid" data-qs="' + i + '">저장</button>' +
        (q ? '<button class="mini" data-qpick="' + i + '">⭐ 이 업체에 맡김</button>' : '') +
        (s.phone ? '<a class="mini" href="tel:' + esc(digits(s.phone)) + '" target="_top">📞</a>' : '') + '</div></div>';
    }).join("") + '</div>';
    if (d.quotes.length) {
      var qs = d.quotes.slice().sort(function(a, b){ return a.amount - b.amount; });
      html += '<div class="card" style="margin-top:10px"><div class="nm" style="font-size:15px">견적 비교 (싼 순서)</div>' + qs.map(function(q, i){
        return '<div class="irow"><span class="grow">' + (i === 0 ? '<b style="color:var(--ok)">' : '') + esc(q.name) + (i === 0 ? '</b>' : '') + (q.note ? ' <span class="hint">' + esc(q.note) + '</span>' : '') + '</span><b>' + man1(q.amount) + '원</b></div>';
      }).join("") + (est ? '<div class="hint">대략 견적 가운데 값: ' + man1(est) + '원</div>' : '') + '</div>';
    }
  }
  return html;
}
function bindSent(j, redraw){
  var d = rpData(j);
  function quoteAt(i){ return d.sent[i]; }
  Array.prototype.forEach.call(document.querySelectorAll("[data-qs]"), function(b){ b.onclick = function(){
    var i = +b.getAttribute("data-qs"), s = quoteAt(i); if (!s) return;
    var a = parseFloat(String(document.querySelector('[data-qa="' + i + '"]').value).replace(/[^\d.]/g, ""));
    var note = document.querySelector('[data-qn="' + i + '"]').value.trim();
    d.quotes = d.quotes.filter(function(q){ return digits(q.phone) !== digits(s.phone); });
    if (a > 0) {
      var r = d.cat === "move" ? { low: 0, high: 0 } : rpCalc(j);
      d.quotes.push({ name: s.name, phone: s.phone, amount: Math.round(a * 10000), note: note, at: nowStr(), est: Math.round((r.low + r.high) / 2) });
    }
    rpSaveNow(j).then(function(){ toast(a > 0 ? (d.cat === "move" ? "받은 견적을 저장했어요. 입주 안내에 비교표로 들어가요." : "받은 견적을 저장했어요. 다음 대략 견적에 반영돼요.") : "지웠어요."); }).catch(function(e){ toast(errText(e)); });
    redraw(j);
  }; });
  Array.prototype.forEach.call(document.querySelectorAll("[data-qpick]"), function(b){ b.onclick = function(){
    var s = quoteAt(+b.getAttribute("data-qpick")); if (!s) return;
    var q = d.quotes.filter(function(x){ return digits(x.phone) === digits(s.phone); })[0];
    var old = rpMyVendor(s.phone, s.name) || {};
    var memo = (old.memo ? old.memo + " / " : "") + nowStr().slice(2, 10) + " " + (j.types.join("·")) + (q ? " " + man1(q.amount) + "원" : "") + (q && q.note ? " " + q.note : "");
    rpVendorForm({ id: old.id || "", name: old.name || s.name, phone: s.phone, addr: old.addr || "", kind: old.kind || j.types.join(", "), memo: memo, stars: old.stars || 0, last: nowStr().slice(0, 10) }, function(){ redraw(j); });
  }; });
}

   현장 정보(분양팀장·조건·수수료) · 분양속지 사진(날짜별) · 호수표(남음/진행/완료) · 바뀐 것 기록

   ========================================================== */
var STE = { loaded: false, loading: null, list: [], saveT: {}, guest: false };
var SITE_ST = [["남음", "#DCFCE7", "#15803D"], ["진행", "#FEF3C7", "#B45309"], ["완료", "#F1F5F9", "#94A3B8"]];
var SITE_STALE_DAYS = 21;

function siteLoad(force){
  if (STE.loaded && !force) return Promise.resolve(STE.list);
  if (STE.loading && !force) return STE.loading;
  STE.loading = call("appSites", PIN).then(function(l){ STE.list = l || []; STE.loaded = true; STE.loading = null; return STE.list; })
    .catch(function(e){ STE.loading = null; throw e; });
  return STE.loading;
}
function siteGet(id){ for (var i = 0; i < STE.list.length; i++) if (STE.list[i].id === String(id)) return STE.list[i]; return null; }
function siteData(s){ s.data = s.data || {}; s.data.units = s.data.units || []; s.data.log = s.data.log || []; return s.data; }
function siteSaveNow(s){ clearTimeout(STE.saveT[s.id]); return call("appSiteSave", PIN, s).then(function(r){ if (r) { s.updated = r.updated; s.left = r.left; s.total = r.total; } return s; }); }
function siteSave(s){ clearTimeout(STE.saveT[s.id]); STE.saveT[s.id] = setTimeout(function(){ siteSaveNow(s).catch(function(e){ toast("저장을 못 했어요: " + errText(e)); }); }, 600); }
function siteCount(s){
  var c = { 남음: 0, 진행: 0, 완료: 0, all: 0 };
  siteData(s).units.forEach(function(u){ c[u.st || "남음"]++; c.all++; });
  return c;
}
function siteDays(t){ if (!t) return -1; var d = new Date(String(t).slice(0, 10) + "T00:00:00"); if (isNaN(d.getTime())) return -1; var n = new Date(); n.setHours(0, 0, 0, 0); return Math.round((n - d) / 86400000); }
function siteFee(s, u){ return (u && u.fee) || siteData(s).fee || ""; }
function sitePriceRange(s){
  var ms = siteData(s).units.filter(function(u){ return (u.st || "남음") === "남음"; }).map(function(u){ return man(u.price); }).filter(function(x){ return x > 0; });
  if (!ms.length) return "";
  var lo = Math.min.apply(null, ms), hi = Math.max.apply(null, ms);
  return lo === hi ? fmtShort(lo) : fmtShort(lo) + "~" + fmtShort(hi);
}

/* ---------- 바뀐 것 (지난 기록과 비교) ---------- */
function siteDiff(s){
  var d = siteData(s), snap = d.snap;
  if (!snap) {
    var c = siteCount(s);
    return c.all ? ["첫 기록 — " + c.all + "세대 중 " + c["남음"] + " 남음"] : [];
  }
  var old = {}; (snap.units || []).forEach(function(u){ old[u.no] = u; });
  var sold = [], prog = [], back = [], price = [], fee = [], added = [], gone = [];
  d.units.forEach(function(u){
    var o = old[u.no], st = u.st || "남음";
    if (!o) { added.push(u.no); return; }
    var ost = o.st || "남음";
    if (st !== ost) { if (st === "완료") sold.push(u.no); else if (st === "진행") prog.push(u.no); else back.push(u.no); }
    var a = man(o.price), b = man(u.price);
    if (a && b && a !== b) price.push(u.no + "호 " + fmtShort(Math.abs(b - a)) + (b < a ? " 내림" : " 올림"));
    else if (String(o.price || "") !== String(u.price || "") && (a || b)) price.push(u.no + "호 " + (o.price || "-") + "→" + (u.price || "-"));
    if (String(o.fee || "") !== String(u.fee || "")) fee.push(u.no + "호 " + (o.fee || "기본") + "→" + (u.fee || "기본"));
  });
  (snap.units || []).forEach(function(u){ if (!d.units.some(function(x){ return x.no === u.no; })) gone.push(u.no); });
  var out = [];
  if (sold.length) out.push(sold.length + "채 나감 (" + sold.join("·") + ")");
  if (prog.length) out.push("계약 진행 " + prog.join("·"));
  if (back.length) out.push("다시 나옴 " + back.join("·"));
  if (price.length) out.push("가격: " + price.join(", "));
  if (String(snap.fee || "") !== String(d.fee || "")) out.push("기본 수수료 " + (snap.fee || "-") + " → " + (d.fee || "-"));
  if (fee.length) out.push("호수 수수료: " + fee.join(", "));
  if (added.length) out.push("호수 더함 " + added.join("·"));
  if (gone.length) out.push("호수 뺌 " + gone.join("·"));
  return out;
}
function siteRecord(s){
  var d = siteData(s), diff = siteDiff(s), c = siteCount(s);
  if (!diff.length) { toast("지난 기록과 달라진 것이 없어요."); return; }
  d.log.push({ at: nowStr(), text: diff.join(" / "), left: c["남음"], all: c.all });
  d.snap = { at: nowStr(), fee: d.fee || "", units: d.units.map(function(u){ return { no: u.no, price: u.price || "", st: u.st || "남음", fee: u.fee || "" }; }) };
  siteSaveNow(s).then(function(){ toast("기록했어요."); }).catch(function(e){ toast(errText(e)); });
  redrawSite(s);
}

/* ---------- 🤖 Gemini 를 화면에서 직접 부르기 (매물v2.8.2) ----------
   앱스 스크립트에 '바깥 연결' 권한이 없어도 되게: 키를 (비밀번호로 들어온 화면에만) 받아 와 브라우저가 바로 AI에 물어봄 */
RP.aiKey = null;
function aiKeyGet(){
  if (RP.aiKey && RP.aiKey.key) return Promise.resolve(RP.aiKey);
  return call("appAiKey", PIN).then(function(r){ RP.aiKey = r || {}; if (!RP.aiKey.key) throw new Error("AI 키가 없어요. [AI 연결]에서 Gemini 키를 넣어 주세요."); return RP.aiKey; });
}
function geminiCall(parts){
  return aiKeyGet().then(function(k){
    // 붐비면(503) 덜 붐비는 모델로 넘어감 · 가벼운(lite) 모델도 뒤에 붙여 둠
    var models = [k.model].concat(k.models || [], ["gemini-flash-latest", "gemini-2.5-flash", "gemini-flash-lite-latest", "gemini-2.5-flash-lite", "gemini-2.0-flash"])
      .filter(function(m, i, a){ return m && a.indexOf(m) === i; });
    var last = "", busy = 0;
    function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
    function tryAt(i){
      if (i >= models.length) return Promise.reject(new Error(busy ? "구글 AI가 지금 많이 붐벼요. 1~2분 뒤 다시 눌러 주세요." : "쓸 수 있는 AI 모델을 찾지 못했어요 (" + last + ")."));
      var ctl = window.AbortController ? new AbortController() : null, tm = ctl ? setTimeout(function(){ ctl.abort(); }, 45000) : null;
      return fetch("https://generativelanguage.googleapis.com/v1beta/models/" + models[i] + ":generateContent?key=" + encodeURIComponent(k.key), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ role: "user", parts: parts }], generationConfig: { responseMimeType: "application/json", temperature: 0.2 } }),
        signal: ctl ? ctl.signal : undefined
      }).then(function(res){
        if (tm) clearTimeout(tm);
        return res.text().then(function(body){
          if (res.status === 404) { last = models[i] + " 없음"; return tryAt(i + 1); }
          if (res.status === 503 || res.status === 500 || res.status === 504) { busy++; last = models[i] + " 붐빔"; return wait(1500).then(function(){ return tryAt(i + 1); }); }
          if (res.status === 400 && /API key not valid|API_KEY_INVALID/i.test(body)) throw new Error("AI 키가 맞지 않아요. 키 전체를 다시 복사해 넣어 주세요.");
          if (res.status === 429) throw new Error("오늘 무료 사용량을 다 썼거나 너무 빨리 눌렀어요. 잠시 뒤(또는 내일) 다시 해 주세요.");
          if (!res.ok) throw new Error("AI 연결 오류 (" + res.status + "): " + body.slice(0, 140));
          var j = JSON.parse(body), t = "";
          try { t = j.candidates[0].content.parts.map(function(x){ return x.text || ""; }).join(""); } catch (e) {}
          if (!t) throw new Error("AI가 답을 못 했어요. 사진을 바꿔 다시 해 주세요.");
          if (models[i] !== k.model) { k.model = models[i]; call("appAiModelSave", PIN, models[i]).catch(function(){}); }
          t = t.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "");
          try { return JSON.parse(t); } catch (e) { throw new Error("AI 답을 읽지 못했어요. 다시 눌러 주세요."); }
        });
      }, function(e){
        if (tm) clearTimeout(tm);
        if (e && e.name === "AbortError") { busy++; last = models[i] + " 너무 오래 걸림"; return tryAt(i + 1); }
        throw new Error("AI에 연결하지 못했어요. 인터넷을 확인해 주세요.");
      });
    }
    return tryAt(0);
  });
}

function rpAiPick(j){
  aiStatus().then(function(st){

    var meta = null;
    return call("appAiRepairParts", PIN, j.id, j.memo || "").then(function(pp){ meta = pp; return geminiCall(pp.parts); }).then(function(r){
      r = r || {};
      r.types = (r.types || []).filter(function(t){ return meta.kinds.indexOf(t) >= 0; });
      r.items = (r.items || []).filter(function(it){ return meta.prices.some(function(x){ return x.kind === it.kind && x.item === it.item; }); });
      c.aiBusy = false;
      if (!r || !(r.types || []).length) { toast("AI가 종류를 고르지 못했어요. 직접 골라 주세요."); redrawRepair(j); return; }
      r.types.forEach(function(t){ if (j.types.indexOf(t) < 0) j.types.push(t); });
      if (!j.memo && r.memo) j.memo = String(r.memo).slice(0, 60);
      var sc = RP_SCOPES.filter(function(x){ return x[0] === r.scope; })[0];
      r.types.forEach(function(t){
        var o = rpCalcOf(j, t);
        if (sc) { o.scope = sc[0]; o.py = sc[1]; }
        if (r.pyeong > 0) { o.py = Number(r.pyeong); o.scope = ""; }
        o.qty = {};
        rpPriceRows(t).forEach(function(p){ o.qty[p.item] = 0; });
        (r.items || []).forEach(function(it){ if (it.kind === t && o.qty.hasOwnProperty(it.item)) o.qty[it.item] = Math.max(0, Number(it.qty) || 0); });
        rpPriceRows(t).forEach(function(p){ if (p.qty === "평" && o.qty[p.item] === 0 && (r.items || []).some(function(it){ return it.item === p.item; })) o.qty[p.item] = o.py; });
      });
      c.mode = "ai"; c.ai = { note: r.note || "", conf: r.confidence || "", at: nowStr() };
      rpSave(j); redrawRepair(j);
      toast("AI가 골랐어요. 맞는지 보고 고쳐 주세요.");
      j.types.forEach(function(k){ if (!RP.found[j.id + "|" + k]) rpSearch(j, k); });
    }).catch(function(e){ c.aiBusy = false; redrawRepair(j); toast(errText(e)); });
  }).catch(function(e){ toast(errText(e)); });
}

function rpSmsFor(j, phone){ var d = digits(phone); return (RP.sms[j.id] || []).filter(function(x){ return x.phone === d; }).slice(-1)[0] || null; }
function rpSmsLoad(j, redraw){
  if (!RP.ai || !RP.ai.sms) return;
  call("appSmsStatus", PIN, j.id).then(function(l){ RP.sms[j.id] = l || []; rpSmsPrune(j); redraw(j); }).catch(function(){});
}
// 멈춤·실패한 자동 문자는 '보낸 곳'에서 빼서 다시 보낼 수 있게
function rpSmsPrune(j){
  var d = rpData(j), n = d.sent.length;
  d.sent = d.sent.filter(function(s){ if (s.mode !== "auto") return true; var q = rpSmsFor(j, s.phone); return !q || q.status === "대기" || q.status === "보냄"; });
  if (d.sent.length !== n) rpSave(j, true);
}
function rpAutoHtml(j){
  var sel = RP.autoSel[j.id] || {}, n = Object.keys(sel).filter(function(k){ return sel[k]; }).length;
  var q = RP.sms[j.id] || [], wait = q.filter(function(x){ return x.status === "대기"; }).length;
  var sms = RP.ai && RP.ai.sms, busy = RL.st && RL.st.job === j.id;
  return '<button class="btn" id="rpRelay" style="margin-top:8px;min-height:44px;font-size:14.5px"' + (n && !busy ? '' : ' disabled') + '>📱 고른 ' + n + '곳 내 핸드폰으로 차례로 보내기</button>' +
    '<div class="hint">업체 칸의 <b>☐ 고르기</b>에 체크 → 문자 앱이 차례로 열려요. [전송]만 누르고 돌아오면 1~3분 뒤 다음 업체 (진동으로 알려 줌).</div>' +
    (sms ? '<button class="btn ghost" id="rpAuto" style="margin-top:8px;min-height:40px;font-size:14px"' + (n ? '' : ' disabled') + '>⏱ 솔라피로 완전 자동 (' + n + '곳 · 화면 닫아도 됨)</button>' : '') +
    (wait ? '<button class="btn danger" id="rpStop" style="margin-top:6px;min-height:40px;font-size:14px">⏸ 솔라피 남은 ' + wait + '곳 멈추기</button>' : '');
}
function rpAutoRowHtml(j, v){
  if (!isCell(v.phone)) return "";
  var q = rpSmsFor(j, v.phone);
  if (q && (q.status === "대기" || q.status === "보냄")) {
    var t = q.status === "대기" ? "⏱ 자동 대기 · " + String(q.due).slice(11, 16) + " 예정" : q.status === "보냄" ? "✔ 자동 보냄 " + String(q.sent).slice(5, 16)
          : q.status === "실패" ? "⚠ 자동 실패: " + q.result : "⏸ 멈춤";
    return '<div class="ln" style="font-weight:700;color:' + (q.status === "실패" ? "var(--warn)" : q.status === "멈춤" ? "var(--muted)" : "var(--navy)") + '">' + esc(t) + '</div>';
  }
  if (rpSentTo(j, v.phone)) return "";
  var on = (RP.autoSel[j.id] || {})[v.id];
  var prev = q ? '<div class="ln" style="font-weight:700;color:' + (q.status === "실패" ? 'var(--warn)">⚠ 자동 실패: ' + esc(q.result) : 'var(--muted)">⏸ 멈춤') + '</div>' : '';
  return prev + '<label style="display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--navy)"><input type="checkbox" data-rauto="' + esc(v.id) + '"' + (on ? ' checked' : '') + ' style="width:20px;height:20px"> 고르기</label>';
}
function bindAuto(j, kind, vs, redraw){
  var d = rpData(j);
  Array.prototype.forEach.call(document.querySelectorAll("[data-rauto]"), function(cb){ cb.onchange = function(){
    var sel = RP.autoSel[j.id] = RP.autoSel[j.id] || {}; sel[cb.getAttribute("data-rauto")] = cb.checked; redraw(j); }; });
  if ($("rpStop")) $("rpStop").onclick = function(){
    if (!confirm("아직 안 보낸 문자를 멈출까요?")) return;
    call("appSmsStop", PIN, j.id).then(function(n){ toast(n + "곳을 멈췄어요."); rpSmsLoad(j, redraw); }).catch(function(e){ toast(errText(e)); });
  };
  if ($("rpRelay")) $("rpRelay").onclick = function(){
    var sel = RP.autoSel[j.id] || {};
    var pick = vs.map(function(v, i){ return [v, i]; }).filter(function(x){ return sel[x[0].id] && isCell(x[0].phone) && !rpSentTo(j, x[0].phone); });
    if (!pick.length) return;
    if (!RP.url) { toast("사진 링크 주소를 아직 못 받았어요. 잠시 뒤 다시."); return; }
    if (!mvIsMove(j) && !rpPhotos(j).length && !confirm("사진이 아직 없어요. 사진 없이 보낼까요?")) return;
    var recent = pick.filter(function(x){ return rpRecentSend(x[0].phone, j); }).map(function(x){ return x[0].name; });
    if (recent.length && !confirm("일주일 안에 이미 문자를 보낸 업체가 있어요:\n" + recent.join(", ") + "\n\n그래도 보낼까요?")) return;
    if (d.sent.length + pick.length > RP_MAX_SEND && !confirm("모두 " + (d.sent.length + pick.length) + "곳이 돼요. 3~5곳이면 충분해요. 그래도 보낼까요?")) return;
    var h = new Date().getHours();
    if ((h >= 21 || h < 8) && !confirm("지금은 밤(아침 8시 전 · 밤 9시 뒤)이에요. 업체가 불편해할 수 있어요. 그래도 보낼까요?")) return;
    if (!isMobile()) { toast("문자는 핸드폰에서만 보낼 수 있어요. 핸드폰에서 이 견적을 열어 주세요."); return; }
    RP.autoSel[j.id] = {};
    rlStart(j, kind, pick.map(function(x){ return { vid: x[0].id, name: x[0].name, phone: x[0].phone, mine: x[0].mine ? x[0].mine.id : "",
      text: (RP.drafts && RP.drafts[j.id + "|" + x[0].id]) || rpMsg(j, x[0], x[1]) }; }));
  };
  if ($("rpAuto")) $("rpAuto").onclick = function(){
    if (!RP.ai || !RP.ai.sms) { aiSettingsForm(function(){ aiStatus(true).then(function(){ redraw(j); }); }); return; }
    var sel = RP.autoSel[j.id] || {};
    var pick = vs.map(function(v, i){ return [v, i]; }).filter(function(x){ return sel[x[0].id] && isCell(x[0].phone); });
    if (!pick.length) return;
    if (!RP.url) { toast("사진 링크 주소를 아직 못 받았어요. 잠시 뒤 다시."); return; }
    if (!mvIsMove(j) && !rpPhotos(j).length && !confirm("사진이 아직 없어요. 사진 없이 보낼까요?")) return;
    if (d.sent.length + pick.length > RP_MAX_SEND && !confirm("모두 " + (d.sent.length + pick.length) + "곳이 돼요. 3~5곳이면 충분해요. 그래도 보낼까요?\n(자동은 한 견적에 5곳까지)")) return;
    if (!confirm(pick.length + "곳에 1~3분 간격으로 한 곳씩 보낼까요?\n\n" + pick.map(function(x){ return "· " + x[0].name; }).join("\n") +
                 "\n\n밤 9시~아침 8시는 아침에 이어서 보내요. 보내는 동안 이 화면을 닫아도 돼요.")) return;
    var items = pick.map(function(x){ return { name: x[0].name, phone: x[0].phone, text: (RP.drafts && RP.drafts[j.id + "|" + x[0].id]) || rpMsg(j, x[0], x[1]) }; });
    var b = this; b.disabled = true; b.textContent = "줄 세우는 중…";
    call("appSmsQueue", PIN, j.id, items).then(function(r){
      RP.sms[j.id] = r.status || [];
      (r.added || []).forEach(function(a){
        var v = pick.filter(function(x){ return digits(x[0].phone) === a.phone; })[0];
        d.sent = d.sent.filter(function(s){ return digits(s.phone) !== a.phone; });
        d.sent.push({ name: a.name, phone: a.phone, kind: kind, at: a.due, mode: "auto", vendor_id: v && v[0].mine ? v[0].mine.id : "" });
      });
      RP.autoSel[j.id] = {};
      rpSaveNow(j).catch(function(){});
      redraw(j);
      toast((r.added || []).length + "곳을 줄 세웠어요." + ((r.skipped || []).length ? " 빠진 곳 " + r.skipped.length : ""));
      if ((r.skipped || []).length) setTimeout(function(){ alert("이번에 빠진 곳:\n\n" + r.skipped.join("\n")); }, 300);
    }).catch(function(e){ b.disabled = false; toast(errText(e)); redraw(j); });
  };
}


/* ==========================================================
   매물v2.8.1 📱 내 핸드폰으로 차례로 보내기 (무료 · 기본)
   고른 업체의 문자 앱을 하나씩 열어 줌 → 사장님은 [전송]만 → 돌아오면 1~3분 기다렸다가 다음 (진동 · 주황 단추)
   · 핸드폰은 사람이 누르지 않으면 문자 앱을 못 열게 막아서, 다음 업체는 [📩 다음 업체 보내기]를 한 번 누름
   · 화면이 새로 열려도(문자 앱에 다녀오는 사이) 이어서 됨 (3시간 안)
   ========================================================== */
var RL = { st: null, timer: null };
function rlSave(){ try { if (RL.st) localStorage.setItem("mm_relay", JSON.stringify(RL.st)); else localStorage.removeItem("mm_relay"); } catch (e) {} }
function rlLoad(){ try { var o = JSON.parse(localStorage.getItem("mm_relay") || "null"); if (o && Date.now() - (o.t || 0) < 3 * 3600 * 1000) RL.st = o; else localStorage.removeItem("mm_relay"); } catch (e) {} }
function rlGap(){ return (60 + Math.floor(Math.random() * 120)) * 1000; }
function rlStart(j, kind, items){
  RL.st = { job: j.id, kind: kind, items: items, i: 0, nextAt: 0, away: false, t: Date.now() };
  rlOpen();
}
function rlJob(){ return RL.st ? rpJob(RL.st.job) : null; }
function rlOpen(){                      // 지금 차례 업체의 문자 앱 열기 (단추를 눌렀을 때만 불림)
  var st = RL.st; if (!st) return;
  var it = st.items[st.i]; if (!it) { rlEnd(true); return; }
  var at = nowStr(), kind = st.kind, jid = st.job;
  rpLoad().then(function(){              // 화면을 새로 연 뒤라 목록이 아직 없어도 '보낸 곳'에 꼭 남김
    var j = rpJob(jid); if (!j) return;
    var d = rpData(j);
    d.sent = d.sent.filter(function(s){ return digits(s.phone) !== digits(it.phone); });
    d.sent.push({ name: it.name, phone: it.phone, kind: kind, at: at, mode: "manual", vendor_id: it.mine || "" });
    rpSaveNow(j).catch(function(){});
    redrawRepair(j);
  }).catch(function(){});
  st.i++; st.away = true; st.nextAt = 0; st.t = Date.now(); rlSave();
  try { localStorage.setItem("mm_last_repair", JSON.stringify({ t: Date.now(), id: st.job })); } catch (e) {}
  rlDraw();
  routeGo("sms:" + digits(it.phone) + (isIOS() ? "&" : "?") + "body=" + encodeURIComponent(it.text));
}
function rlBack(){                      // 문자 앱에서 돌아옴 → 1~3분 기다리기 시작
  var st = RL.st; if (!st || !st.away) return;
  st.away = false;
  if (st.i >= st.items.length) { rlEnd(true); return; }
  st.nextAt = Date.now() + rlGap(); st.buzzed = false; rlSave(); rlDraw();
}
function rlEnd(done){
  var st = RL.st; RL.st = null; rlSave();
  clearInterval(RL.timer); RL.timer = null;
  var b = $("relay"); if (b) b.parentNode.removeChild(b);
  if (st) { var j = rpJob(st.job); if (j) redrawRepair(j); }
  if (done) toast("고른 업체에 다 보냈어요. 답장 오면 받은 견적에 적어 주세요.");
}
function rlDraw(){
  var st = RL.st, b = $("relay");
  if (!st) { if (b) b.parentNode.removeChild(b); return; }
  if (!b) { b = document.createElement("div"); b.id = "relay"; document.body.appendChild(b); }
  var it = st.items[st.i], left = st.nextAt ? Math.max(0, Math.ceil((st.nextAt - Date.now()) / 1000)) : 0;
  var ready = it && !st.away && left === 0;
  if (ready && st.nextAt && !st.buzzed) { st.buzzed = true; rlSave(); try { navigator.vibrate && navigator.vibrate([200, 120, 200]); } catch (e) {} }
  var mm = Math.floor(left / 60) + ":" + ("0" + (left % 60)).slice(-2);
  b.innerHTML = '<div class="rl-in"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1">📱 차례로 보내기 ' + Math.min(st.i + (st.away ? 0 : 1), st.items.length) + '/' + st.items.length + '</b>' +
      '<button class="mini" id="rlX" style="margin:0">그만</button></div>' +
    (st.away ? '<div style="font-size:14px;margin-top:6px">문자 앱에서 <b>[전송]</b>을 누르고 이 화면으로 돌아와 주세요.</div><button class="btn ghost" id="rlBack" style="margin-top:8px;min-height:40px">돌아왔어요</button>'
      : it ? '<div style="font-size:14px;margin-top:6px">다음: <b>' + esc(it.name) + '</b> ' + esc(fmtPhone(it.phone)) + '</div>' +
        '<button class="btn" id="rlGo" style="margin-top:8px;min-height:46px;' + (ready ? 'background:#F59E0B;color:#1F1300' : 'opacity:.85') + '">' +
          (ready ? '📩 다음 업체 보내기' : '⏱ ' + mm + ' 뒤 (지금 보내려면 누르기)') + '</button>' +
        '<button class="mini" id="rlSkip" style="margin:6px 0 0">이 업체 건너뛰기</button>' : '') + '</div>';
  $("rlX").onclick = function(){ if (confirm("차례로 보내기를 그만할까요? (이미 보낸 곳은 그대로)")) rlEnd(false); };
  if ($("rlBack")) $("rlBack").onclick = rlBack;
  if ($("rlGo")) $("rlGo").onclick = function(){
    var l = st.nextAt ? st.nextAt - Date.now() : 0;
    if (l > 5000 && !confirm("간격을 두면 업체가 단체 문자로 덜 느껴요. 기다리지 않고 지금 보낼까요?")) return;
    rlOpen();
  };
  if ($("rlSkip")) $("rlSkip").onclick = function(){ st.i++; st.nextAt = st.nextAt || 0; rlSave(); if (st.i >= st.items.length) rlEnd(true); else rlDraw(); };
  if (!RL.timer) RL.timer = setInterval(function(){ if (RL.st && !RL.st.away && RL.st.nextAt) rlDraw(); }, 1000);
}
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible" && RL.st && RL.st.away) setTimeout(rlBack, 600); });
function rlResume(){ rlLoad(); if (RL.st) { if (RL.st.away) rlBack(); else rlDraw(); } }

/* ---------- 시작 ---------- */
if (!BALPUM.Auth.user()) { if (!(window.joinFromUrl && joinFromUrl())) showLogin(); }
else call("appCheck", PIN).then(startHome).catch(function(e){ showLogin(errText(e)); });
</script>
