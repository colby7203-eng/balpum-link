<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손님은 왕! 발품 끝! — 발품 TOUR</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="손님은 왕! 발품 끝! — 발품 TOUR (무료)">
<meta property="og:description" content="집 구하기 · 집 내놓기(몰래도) · 최저가 확인 · 달력 · 영어 수다를 앱 하나로. 핸드폰 속 집 앞 부동산">
<meta property="og:image" content="app/icons/foot.png">
<link rel="icon" href="app/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&family=Nanum+Brush+Script&family=Nanum+Pen+Script&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#FFD43B}
  #wrap{max-width:430px;margin:0 auto}
  #pcqr{display:none;max-width:430px;margin:0 auto;padding:14px 16px 24px;background:#FFD43B;font-family:'Noto Sans KR',sans-serif;text-align:center}
  #pcqr .b{background:#fff;border:3px solid #141414;border-radius:18px;box-shadow:5px 5px 0 #141414;padding:14px;display:inline-flex;gap:14px;align-items:center;text-align:left}
  #pcqr #q{width:140px;height:140px}
  #msg{display:none;position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;background:#0F172A;color:#fff;border-radius:16px;padding:12px 14px;font:700 14px 'Noto Sans KR',sans-serif;line-height:1.5;box-shadow:0 10px 26px rgba(0,0,0,.35)}
  #off{display:none;max-width:430px;margin:0 auto;padding:30px 18px;font:700 16px 'Noto Sans KR',sans-serif;text-align:center}
</style>
</head>
<body>
<div id="off">이 초대는 부동산에서 잠시 멈춰 두었어요.<br>부동산에 새 초대를 부탁해 주세요.</div>
<div id="wrap"></div>
<div id="pcqr"><div class="b"><div id="q"></div><div><b style="font-family:'Nanum Brush Script',cursive;font-size:30px;font-weight:400">카메라만 대시면 되옵니다</b><br><span style="font-size:14px;font-weight:700">PC로 보고 계시면 핸드폰 카메라로 찍으세요</span></div></div></div>
<div id="msg"></div>
<script src="config.js"></script>
<script src="banner18.js"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search), c = String(q.get("c") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6), mail = q.get("m") === "mail";
  var v = mail ? "mail" : "send";
  var touch = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  function say(t){ var m = document.getElementById("msg"); m.innerHTML = t; m.style.display = "block"; clearTimeout(say.t); say.t = setTimeout(function(){ m.style.display = "none"; }, 7000); }
  function copyCode(){ var t = "발품초대:" + c + "/" + v; try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).catch(function(){}); return; } } catch (er) {}
    try { var a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); } catch (er) {} }
  function draw(info){
    var o = { office: mail ? "" : (info && info.office) || "", ceo: (info && info.ceo) || "", tel: (info && info.tel) || "", mobile: "", email: "",
      show: { ceo: !!(info && info.ceo), tel: true }, mail: mail || !info, foot: "app/icons/foot.png",
      apk: "balpum-tour.apk", web: "app/?join=" + encodeURIComponent(c) + "&v=" + v, have: true };
    document.getElementById("wrap").innerHTML = "<style>" + BP_BANNER.css + "</style>" + BP_BANNER.phone(o);
    var apk = document.getElementById("bpbApk"), web = document.getElementById("bpbWeb"), have = document.getElementById("bpbHave");
    if (apk) { apk.setAttribute("download", ""); apk.addEventListener("click", function(){ copyCode(); say("📋 초대 코드를 복사해 두었어요. 받은 파일을 열어 깔고, 앱을 열면 저절로 들어가요." + (info && info.office && !mail ? "<br>(" + info.office + " 손님으로 바로 연결)" : "")); }); }
    if (have) have.addEventListener("click", function(ev){ ev.preventDefault(); copyCode(); say("📋 복사했어요. 이제 <b>발품 앱을 열면</b> \"" + ((info && info.office) || "이 부동산") + "을(를) 내 부동산에 더할까요?\"가 떠요. [더하기]만 누르세요."); });
    if (!touch) {     // PC: 핸드폰으로 찍을 QR
      document.getElementById("pcqr").style.display = "block";
      var s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
      s.onload = function(){ new QRCode(document.getElementById("q"), { text: location.href.split("#")[0], width: 140, height: 140 }); };
      document.head.appendChild(s);
    }
  }
  if (!c) { draw(null); return; }
  var C = window.BALPUM_CONFIG || {};
  fetch(String(C.SUPABASE_URL).replace(/\/+$/, "") + "/rest/v1/rpc/invite_info", { method: "POST",
    headers: { "apikey": C.SUPABASE_KEY, "Authorization": "Bearer " + C.SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ c: c }) })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(r){ r = Array.isArray(r) ? r[0] : r; if (r && r.off) { document.getElementById("off").style.display = "block"; return; } draw(r && r.office ? r : null); })
    .catch(function(){ draw(null); });
})();
</script>
</body>
</html>
